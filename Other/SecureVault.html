      // ── Default window position ────────────────────────────────
      function _defaultPos(idx) {
        const cascade = idx * 28;
        const w = Math.min(900, window.innerWidth * .82);
        const h = Math.min(680, (window.innerHeight - 70) * .82);
        const taskH = 70;
        const maxTop = window.innerHeight - taskH - h;
        return {
          left: Math.min(80 + cascade, window.innerWidth - w - 20),
          top: Math.min(40 + cascade, Math.max(0, maxTop)),
          width: w, height: h
        };
      }

      // ════════════════════════════════════════════════════════════
      //  VIRTUAL HTML RUNTIME  — multi-page + data: URI asset system
      //  Uses data: URIs instead of blob: URLs to work on file:///
      //  and avoid the blob:null cross-origin iframe issue.
      // ════════════════════════════════════════════════════════════

      // Convert ArrayBuffer to base64 data: URI
      function _toDataUri(buf, mimeType) {
        const bytes = new Uint8Array(buf);
        let binary = '';
        const chunkSize = 8192;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(i, Math.min(i + chunkSize, bytes.length)));
        }
        return 'data:' + (mimeType || 'application/octet-stream') + ';base64,' + btoa(binary);
      }

      // Recursively gather all files in a folder tree
      async function _gatherFolder(folderId, getData, prefix) {
        prefix = prefix || '';
        const items = await lsDir(folderId, true);
        const result = [];
        for (const item of items) {
          const itemPath = prefix ? prefix + '/' + item.name : item.name;
          if (item.type === 'file') {
            result.push({ ...item, path: itemPath });
          } else if (item.type === 'folder') {
            const sub = await _gatherFolder(item.id, getData, itemPath);
            result.push(...sub);
          }
        }
        return result;
      }

      // Build virtual filesystem: all siblings as data: URIs
      async function _buildVirtualFS(rootItem, getData) {
        const parentId = rootItem.parentId;
        // vfs: filename → { id, mimeType, dataUri, name }
        const vfs = new Map();
        const pathVfs = new Map(); // relative path → dataUri
        const blobUrls = []; // kept empty — no blob URLs needed now

        const allFiles = await _gatherFolder(parentId, getData);
        for (const f of allFiles) {
          try {
            const buf = await getData(f.id);
            const mime = f.mimeType || _guessMimeFromName(f.name);
            const dataUri = _toDataUri(buf, mime);
            const entry = { id: f.id, mimeType: mime, dataUri, name: f.name };
            // Index by plain filename (last segment)
            if (!vfs.has(f.name)) vfs.set(f.name, entry);
            // Index by full path too
            if (f.path) {
              pathVfs.set(f.path, dataUri);
              // Also index last segment with path to avoid collisions
              const seg = f.path.split('/').pop();
              if (!vfs.has(seg)) vfs.set(seg, entry);
            }
          } catch (e) { /* skip files that fail to decrypt */ }
        }

        return { vfs, pathVfs, blobUrls };
      }

      function _guessMimeFromName(name) {
        const ext = name.split('.').pop().toLowerCase();
        return ({
          js: 'text/javascript', css: 'text/css', html: 'text/html', htm: 'text/html',
          png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
          svg: 'image/svg+xml', webp: 'image/webp', ico: 'image/x-icon',
          mp4: 'video/mp4', webm: 'video/webm', mp3: 'audio/mpeg', ogg: 'audio/ogg',
          wav: 'audio/wav', woff: 'font/woff', woff2: 'font/woff2', ttf: 'font/ttf',
          json: 'application/json', xml: 'text/xml', txt: 'text/plain',
          pdf: 'application/pdf'
        })[ext] || 'application/octet-stream';
      }

      // Rewrite HTML: embed all assets as data: URIs and inline CSS/JS
      // This makes the output a fully self-contained HTML string safe for srcdoc
      function _rewriteHtml(htmlStr, vfs, pathVfs) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlStr, 'text/html');

        function resolveAsset(rel) {
          if (!rel) return null;
          if (rel.startsWith('http') || rel.startsWith('data:') || rel.startsWith('#') || rel.startsWith('javascript:') || rel.startsWith('mailto:')) return null;
          let clean = rel.split('?')[0].split('#')[0];
          // Normalize: strip a leading "/" (absolute-from-root paths like
          // "/style.css" or "/img/logo.png") and resolve "./" / "../" segments.
          clean = clean.replace(/^\.\//, '').replace(/^\/+/, '');
          if (clean.includes('../') || clean.includes('./')) {
            const parts = [];
            clean.split('/').forEach(seg => {
              if (seg === '..') parts.pop();
              else if (seg !== '.' && seg !== '') parts.push(seg);
            });
            clean = parts.join('/');
          }
          const byName = vfs.get(clean) || vfs.get(clean.split('/').pop());
          if (byName) return byName;
          const byPath = pathVfs.get(clean) || pathVfs.get(clean.split('/').pop());
          if (byPath) return { dataUri: byPath };
          return null;
        }

        // Inline <link rel="stylesheet"> as <style>
        doc.querySelectorAll('link[rel="stylesheet"], link[type="text/css"]').forEach(el => {
          const entry = resolveAsset(el.getAttribute('href'));
          if (entry && entry.dataUri) {
            try {
              const b64 = entry.dataUri.split(',')[1];
              const css = atob(b64);
              const style = doc.createElement('style');
              style.textContent = css;
              el.parentNode.replaceChild(style, el);
            } catch (e) { if (entry.dataUri) el.setAttribute('href', entry.dataUri); }
          }
        });

        // Inline <script src> as inline <script>
        doc.querySelectorAll('script[src]').forEach(el => {
          const entry = resolveAsset(el.getAttribute('src'));
          if (entry && entry.dataUri) {
            try {
              const b64 = entry.dataUri.split(',')[1];
              const js = atob(b64);
              const inlined = doc.createElement('script');
              Array.from(el.attributes).forEach(a => { if (a.name !== 'src') inlined.setAttribute(a.name, a.value); });
              inlined.textContent = js;
              el.parentNode.replaceChild(inlined, el);
            } catch (e) { el.setAttribute('src', entry.dataUri); }
          }
        });

        // Rewrite img/video/audio/source src
        ['img[src]', 'video[src]', 'audio[src]', 'source[src]'].forEach(sel => {
          doc.querySelectorAll(sel).forEach(el => {
            const entry = resolveAsset(el.getAttribute('src'));
            if (entry) el.setAttribute('src', entry.dataUri);
          });
        });

        // Rewrite video/img poster
        doc.querySelectorAll('[poster]').forEach(el => {
          const entry = resolveAsset(el.getAttribute('poster'));
          if (entry) el.setAttribute('poster', entry.dataUri);
        });

        // Rewrite inline style background-image url()
        doc.querySelectorAll('[style]').forEach(el => {
          const st = el.getAttribute('style');
          if (!st || !st.includes('url(')) return;
          const rewritten = st.replace(/url\((['"]?)([^'"\)]+)\1\)/g, (m, q, u) => {
            const entry = resolveAsset(u);
            return entry ? `url('${entry.dataUri}')` : m;
          });
          el.setAttribute('style', rewritten);
        });

        // Rewrite <a href> — HTML pages use postMessage navigation; assets get data URI
        doc.querySelectorAll('a[href]').forEach(el => {
          const href = el.getAttribute('href');
          if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('data:')) return;
          const clean = href.split('?')[0].split('#')[0].replace(/^\.\//, '');
          const targetName = clean.split('/').pop();
          const entry = vfs.get(targetName) || vfs.get(clean);
          if (entry && (entry.mimeType === 'text/html' || /\.html?$/i.test(targetName))) {
            const safePage = targetName.replace(/\\/g, '').replace(/'/g, '');
            el.setAttribute('href', 'javascript:void(0)');
            el.setAttribute('onclick', `window.parent.postMessage({type:'sv-nav',page:'${safePage}'},'*');return false;`);
          } else if (entry) {
            el.setAttribute('href', entry.dataUri);
            el.setAttribute('target', '_blank');
          }
        });

        // Rewrite CSS @import and url() inside <style> tags
        doc.querySelectorAll('style').forEach(el => {
          if (!el.textContent) return;
          el.textContent = el.textContent.replace(/url\((['"]?)([^'"\)]+)\1\)/g, (m, q, u) => {
            const entry = resolveAsset(u);
            return entry ? `url('${entry.dataUri}')` : m;
          });
        });

        // Ensure a sane viewport: pages without their own <meta name="viewport">
        // render at the browser's default ~980px layout width, which makes
        // content look tiny/zoomed-out (or oddly large) inside the app window.
        if (!doc.querySelector('meta[name="viewport"]')) {
          const vp = doc.createElement('meta');
          vp.setAttribute('name', 'viewport');
          vp.setAttribute('content', 'width=device-width, initial-scale=1');
          (doc.head || doc.documentElement).insertBefore(vp, (doc.head || doc.documentElement).firstChild);
        }
        // Minimal reset so the page fills the window instead of leaving
        // default browser margins that read as "everything is off-center/zoomed"
        const resetStyle = doc.createElement('style');
        resetStyle.textContent = 'html,body{margin:0;padding:0;min-height:100%;} html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}';
        (doc.head || doc.documentElement).insertBefore(resetStyle, (doc.head || doc.documentElement).firstChild);

        // Inject SecureVault runtime bridge (before all other scripts)
        const bridge = doc.createElement('script');
        bridge.textContent = [
          '(function(){',
          '  "use strict";',
          '  window.svNavigate = function(page){ window.parent.postMessage({type:"sv-nav",page:page},"*"); };',
          '  window.svClose    = function(){ window.parent.postMessage({type:"sv-close"},"*"); };',
          '  window.svBack     = function(){ window.parent.postMessage({type:"sv-back"},"*"); };',
          '  window.svForward  = function(){ window.parent.postMessage({type:"sv-fwd"},"*"); };',
          '  // Guard localStorage/sessionStorage: even with allow-same-origin,',
          '  // browser tracking-prevention (or a sandbox without that flag)',
          '  // can still block storage access and throw a SecurityError.',
          '  // Fall back to an in-memory shim so the page never crashes.',
          '  function shimStorage(name){',
          '    try { var t = "__probe__"; window[name].setItem(t,"1"); window[name].removeItem(t); return; }',
          '    catch(e){}',
          '    var mem = Object.create(null);',
          '    var fake = {',
          '      getItem: function(k){ return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; },',
          '      setItem: function(k,v){ mem[k] = String(v); },',
          '      removeItem: function(k){ delete mem[k]; },',
          '      clear: function(){ mem = Object.create(null); },',
          '      key: function(i){ return Object.keys(mem)[i] || null; },',
          '      get length(){ return Object.keys(mem).length; }',
          '    };',
          '    try { Object.defineProperty(window, name, { value: fake, configurable: true }); } catch(e){}',
          '  }',
          '  shimStorage("localStorage");',
          '  shimStorage("sessionStorage");',
          '  // Zoom control driven by the app-window\'s +/− buttons',
          '  window.addEventListener("message", function(e){',
          '    if (e.data && e.data.type === "sv-zoom") {',
          '      var level = e.data.level;',
          '      document.documentElement.style.transformOrigin = "0 0";',
          '      document.documentElement.style.transform = "scale(" + level + ")";',
          '      document.documentElement.style.width = (100 / level) + "%";',
          '      document.documentElement.style.height = (100 / level) + "%";',
          '    }',
          '  });',
          '  // Capture uncaught errors',
          '  window.addEventListener("error", function(e){',
          '    window.parent.postMessage({type:"sv-error",msg:e.message},"*");',
          '  });',
          '  window.addEventListener("unhandledrejection", function(e){',
          '    window.parent.postMessage({type:"sv-error",msg:String(e.reason)},"*");',
          '  });',
          '})()',
        ].join('\n');
        doc.head.insertBefore(bridge, doc.head.firstChild);

        return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
      }

      // ── Open an HTML app window ────────────────────────────────
      async function openHtml(item, getData) {
        // Show loading toast
        const loadId = 'Loading ' + item.name + '…';
        toast(loadId, 'i');

        try {
          const { vfs, pathVfs, blobUrls } = await _buildVirtualFS(item, getData);
          const idx = windows.length;
          const pos = _defaultPos(idx);
          const winId = wid();

          // Create window element
          const el = document.createElement('div');
          el.className = 'sv-window wm-focused';
          el.style.cssText = `left:${pos.left}px;top:${pos.top}px;width:${pos.width}px;height:${pos.height}px`;

          // App navigation bar
          const appnav = document.createElement('div'); appnav.className = 'wm-appnav';
          const navBack = document.createElement('button'); navBack.className = 'wm-appnav-btn'; navBack.disabled = true;
          navBack.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
          const navFwd = document.createElement('button'); navFwd.className = 'wm-appnav-btn'; navFwd.disabled = true;
          navFwd.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
          const addrBar = document.createElement('div'); addrBar.className = 'wm-appnav-addr'; addrBar.textContent = item.name;
          const reload = document.createElement('button'); reload.className = 'wm-appnav-reload';
          reload.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 018-8 8 8 0 016.93 4H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v4h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
          const zoomOut = document.createElement('button'); zoomOut.className = 'wm-appnav-btn'; zoomOut.title = 'Zoom out';
          zoomOut.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
          const zoomLabel = document.createElement('div'); zoomLabel.className = 'wm-appnav-zoom-label'; zoomLabel.textContent = '100%';
          const zoomIn = document.createElement('button'); zoomIn.className = 'wm-appnav-btn'; zoomIn.title = 'Zoom in';
          zoomIn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
          appnav.append(navBack, navFwd, addrBar, zoomOut, zoomLabel, zoomIn, reload);

          let zoomLevel = 1;
          function applyZoom() {
            zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
            frame.contentWindow?.postMessage({ type: 'sv-zoom', level: zoomLevel }, '*');
          }
          zoomOut.onclick = () => { zoomLevel = Math.max(0.5, +(zoomLevel - 0.1).toFixed(2)); applyZoom(); };
          zoomIn.onclick = () => { zoomLevel = Math.min(2.5, +(zoomLevel + 0.1).toFixed(2)); applyZoom(); };
          zoomLabel.ondblclick = () => { zoomLevel = 1; applyZoom(); };

          // Page history for the app
          const pageHistory = [item.name];
          let pageIdx = 0;

          async function loadPage(pageName) {
            addrBar.textContent = pageName;
            const entry = vfs.get(pageName);
            if (!entry) { toast('Page not found: ' + pageName, 'w'); return; }
            try {
              // Read raw HTML from encrypted vault
              const buf = await getData(entry.id);
              const rawHtml = new TextDecoder().decode(buf);
              // Rewrite with all assets inlined as data: URIs
              const rewritten = _rewriteHtml(rawHtml, vfs, pathVfs);
              // Use srcdoc — works on file:// without blob:null issues
              // First clear src to avoid confusion
              frame.removeAttribute('src');
              frame.srcdoc = rewritten;
            } catch (e) {
              console.error('[SV loadPage]', e);
              toast('Error loading page: ' + e.message, 'e');
            }
          }

          reload.onclick = () => loadPage(pageHistory[pageIdx]);
          navBack.onclick = () => { if (pageIdx > 0) { pageIdx--; navFwd.disabled = false; navBack.disabled = pageIdx === 0; loadPage(pageHistory[pageIdx]); } };
          navFwd.onclick = () => { if (pageIdx < pageHistory.length - 1) { pageIdx++; navBack.disabled = false; navFwd.disabled = pageIdx === pageHistory.length - 1; loadPage(pageHistory[pageIdx]); } };

          // iframe
          const body = document.createElement('div'); body.className = 'wm-body';
          const frame = document.createElement('iframe');
          frame.className = 'wm-frame';
          // NOTE: allow-same-origin is included so that pages using
          // localStorage/sessionStorage/IndexedDB don't crash with
          // "document is sandboxed and lacks the allow-same-origin flag".
          // Trade-off: combined with allow-scripts, the loaded page's
          // scripts run same-origin as this SecureVault window (rather
          // than in a unique opaque sandbox origin), so they *could*
          // technically reach window.parent. This is acceptable here
          // because the content is the user's own vault file, not
          // third-party/untrusted network content.
          frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals allow-same-origin');
          body.appendChild(frame);

          const iconSvg = _typeIcon('html');
          const win = { id: winId, el, type: 'html', item, title: item.name, iconSvg, minimized: false, maximized: false, zIdx: ++zCounter, blobUrls };
          windows.push(win);

          _buildChrome(win, item.name, iconSvg, null);
          win.el.insertBefore(appnav, win.el.querySelector('.wm-body') || win.el.children[1] || null);

      if (!meta) throw new Error('File not found');

      if (!encData) throw new Error('No data found');
      return decrypt(encData);
    }

    async function saveData(id, arrayBuffer) {
      const enc = await encrypt(arrayBuffer);
      await saveBlob(id, enc);
    }

    async function rmItem(id) {
      const meta = await getFile(id);
      if (!meta) return;
      if (meta.type === 'folder') {
        const kids = await getKids(id);
        for (const kid of kids) await rmItem(kid.id);
      }
      await delFile(id);
      await delBlob(id);
    }

    async function cpItem(id, targetPid) {
      const meta = await getFile(id);
      if (!meta) return;
      const newId = crypto.randomUUID();
      if (meta.type === 'folder') {
        await saveFile({ ...meta, id: newId, parentId: targetPid, createdAt: Date.now(), updatedAt: Date.now() });
        const kids = await getKids(id);
        for (const kid of kids) await cpItem(kid.id, newId);
      } else {
        const blob = await getBlob(id);
        await saveFile({ ...meta, id: newId, parentId: targetPid, createdAt: Date.now(), updatedAt: Date.now() });
        if (blob) await saveBlob(newId, blob);
      }
    }

    async function mvItem(id, targetPid) {
      await patchFile(id, { parentId: targetPid });
    }

    // ════════════════════════════════════════════════════════════
    // FEATURE: Drag & drop items onto folders / the Hidden Vault
    // Supports native HTML5 DnD (desktop, mouse) AND a touch-friendly
    // long-press-then-drag fallback (phones/tablets), sharing the
    // same drop-target registry and move logic either way.
    // ════════════════════════════════════════════════════════════
    const FileDnD = (() => {
      let dragIds = [];
      let ghostEl = null;
      let touchDragging = false;
      let lastTarget = null;
      let longPressTimer = null;

      function idsForDrag(item) {
        // Dragging a selected item drags the whole current selection with it
        if (selection.has(item.id) && selection.size > 1) return [...selection.selected];
        return [item.id];
      }

      function findDropZone(el) {
        while (el && el !== document.body) {
          if (el._dndTarget) return el;
          el = el.parentElement;
        }
        return null;
      }

      function clearHighlight() { lastTarget?.classList.remove('dnd-drop-target'); lastTarget = null; }
      function updateHighlight(target) {
        const dz = findDropZone(target);
        if (dz === lastTarget) return;
        clearHighlight();
        if (dz) dz.classList.add('dnd-drop-target');
        lastTarget = dz;
      }

      function showGhost(item, x, y) {
        ghostEl = document.createElement('div');
        ghostEl.className = 'dnd-ghost';
        const count = dragIds.length;
        ghostEl.innerHTML = `${getIcon(item.mimeType, item.type)}<span>${count > 1 ? count + ' items' : escHtml(item.name)}</span>`;
        document.body.appendChild(ghostEl);
        moveGhost(x, y);
      }
      function moveGhost(x, y) { if (ghostEl) { ghostEl.style.left = x + 'px'; ghostEl.style.top = y + 'px'; } }
      function hideGhost() { ghostEl?.remove(); ghostEl = null; }

      function runDrop(dz, ids) {
        if (!dz || !ids.length) return;
        const t = dz._dndTarget;
        if (t.toHiddenVault) moveItemsToHiddenVault(ids);
        else if (t.getFolderId) Promise.resolve(t.getFolderId()).then(fid => { if (fid) moveItemsToFolder(ids, fid); });
        else if (t.folderId) moveItemsToFolder(ids, t.folderId);
      }

      // Make an item element (grid card / list row / gallery card) a drag source
      // Multi-select mode for touch: entered via an explicit toolbar toggle (not
      // long-press — long-press is already the native gesture for the mobile
      // context-menu bottom sheet, so we don't want to race against that).
      let touchSelectMode = false;
      function setTouchSelectMode(on) {
        touchSelectMode = on;
        document.body.classList.toggle('touch-select-mode', on);
        document.getElementById('btn-mselect')?.classList.toggle('active', on);
        if (!on) selection.clear();
      }

      function makeDraggableSource(el, item) {
        el.setAttribute('draggable', 'true');
        el.addEventListener('dragstart', e => {
          dragIds = idsForDrag(item);
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', dragIds.join(',')); } catch { }
          el.classList.add('dnd-source-dragging');
        });
        el.addEventListener('dragend', () => {
          el.classList.remove('dnd-source-dragging');
          dragIds = [];
          clearHighlight();
        });
        // Desktop double-click still opens; single click still selects (unchanged).

        // ── Touch gesture state machine ──
        // quick tap → open (or toggle selection, while in explicit multi-select mode)
        // hold, then move → picks the item up and starts a drag
        // hold, released without ever moving → we do nothing at all here, so the
        //   browser's own native long-press → contextmenu → bottom-sheet still works
        let startX = 0, startY = 0, holdArmed = false, dragEngaged = false;

        el.addEventListener('touchstart', e => {
          if (e.touches.length !== 1) return;
          const touch = e.touches[0];
          startX = touch.clientX; startY = touch.clientY;
          holdArmed = false; dragEngaged = false;
          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(() => { holdArmed = true; }, 320);
        }, { passive: true });

        el.addEventListener('touchmove', e => {
          const touch = e.touches[0];
          const movedFar = Math.abs(touch.clientX - startX) > 8 || Math.abs(touch.clientY - startY) > 8;

          if (!dragEngaged) {
            if (!holdArmed) {
              // Still within the hold window — real movement here means it's a
              // scroll, not a drag, so drop the pending timer entirely.
              if (movedFar) clearTimeout(longPressTimer);
              return;
            }
            if (!movedFar) return; // held past the threshold but hasn't actually moved yet — leave it to the browser
            // First movement after the hold threshold: NOW engage the drag (not before)
            dragEngaged = true;
            touchDragging = true;
            dragIds = idsForDrag(item);
            el.classList.add('dnd-source-dragging');
            showGhost(item, touch.clientX, touch.clientY);
            if (navigator.vibrate) navigator.vibrate(12);
          }

          e.preventDefault();
          moveGhost(touch.clientX, touch.clientY);
          updateHighlight(document.elementFromPoint(touch.clientX, touch.clientY));
        }, { passive: false });

        const endTouch = e => {
          clearTimeout(longPressTimer);

          if (dragEngaged) {
            touchDragging = false;
            el.classList.remove('dnd-source-dragging');
            hideGhost();
            clearHighlight();
            const touch = e.changedTouches[0];
            const dz = findDropZone(document.elementFromPoint(touch.clientX, touch.clientY));
            runDrop(dz, dragIds);
            dragIds = [];
            return;
          }

          if (!holdArmed) {
            // A genuine quick tap (never reached the hold threshold at all)
            e.preventDefault();
            if (touchSelectMode) {
              if (selection.has(item.id)) selection.delete(item.id); else selection.add(item.id);
            } else {
              resetAutoLock();
              handleItemOpen(item);
            }
          }
          // else: held still past the threshold but never moved — leave this
          // alone entirely; the browser's native contextmenu gesture owns it.
        };
        el.addEventListener('touchend', endTouch);
        el.addEventListener('touchcancel', () => {
          clearTimeout(longPressTimer);
          if (dragEngaged) { touchDragging = false; el.classList.remove('dnd-source-dragging'); hideGhost(); clearHighlight(); dragIds = []; }
        });
      }

      // Make an element (folder card, sidebar item, Hidden Vault button…) a drop target
      function makeDropTarget(el, opts) {
        el._dndTarget = opts;
        el.addEventListener('dragover', e => {
          e.preventDefault();
          el.classList.add('dnd-drop-target');
        });
        el.addEventListener('dragleave', () => el.classList.remove('dnd-drop-target'));
        el.addEventListener('drop', e => {
          e.preventDefault();
          el.classList.remove('dnd-drop-target');
          let ids = dragIds;
          if (!ids.length) {
            const raw = e.dataTransfer?.getData('text/plain');
            ids = raw ? raw.split(',').filter(Boolean) : [];
          }
          runDrop(el, ids);
          dragIds = [];
        });
      }

      return { makeDraggableSource, makeDropTarget, enterSelectMode: () => setTouchSelectMode(true), exitSelectMode: () => setTouchSelectMode(false), isSelectMode: () => touchSelectMode };
    })();

    async function moveItemsToFolder(ids, targetPid) {
      if (!ids?.length) return;
      let moved = 0;
      for (const id of ids) {
        if (id === targetPid) continue; // dropping a folder onto itself is a no-op
        const meta = await getFile(id);
        if (!meta) continue;
        if (meta.parentId === targetPid) continue; // already there
        if (meta.type === 'folder') {
          // Refuse to move a folder into its own descendant (would orphan it)
          let cur = targetPid, guard = 0, isDescendant = false;
          while (cur && cur !== ROOT && guard < 50) {
            if (cur === id) { isDescendant = true; break; }
            const f = await getFile(cur);
            cur = f?.parentId; guard++;
          }
          if (isDescendant) continue;
        }
        await mvItem(id, targetPid);
        moved++;
      }
      if (moved) {
        clearThumbCache();
        await renderAll();
        toast(moved === 1 ? 'Moved 1 item' : `Moved ${moved} items`, 's');
      }
    }

    async function moveItemsToHiddenVault(ids) {
      if (!ids?.length) return;
      if (!isHiddenUnlocked()) {
        await openHiddenVault({ onEnter: () => { } });
        if (!isHiddenUnlocked()) return; // user cancelled the unlock/setup prompt
      }
      let moved = 0;
      for (const id of ids) {
        const meta = await getFile(id);
        if (!meta || meta.parentId === HIDDEN_VAULT_ROOT) continue;
        await patchFile(id, { parentId: HIDDEN_VAULT_ROOT });
        moved++;
      }
      if (moved) {
        clearThumbCache();
        await renderAll();
        toast(moved === 1 ? '🔒 Moved 1 item to Hidden Vault' : `🔒 Moved ${moved} items to Hidden Vault`, 's');
      }
    }

    async function guessMime(name) {
      const ext = name.split('.').pop()?.toLowerCase();
      const map = {
        jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
        webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp',
        mp4: 'video/mp4', webm: 'video/webm', ogg: 'video/ogg', mov: 'video/quicktime',
        mp3: 'audio/mpeg', wav: 'audio/wav', flac: 'audio/flac', aac: 'audio/aac',
        txt: 'text/plain', html: 'text/html', htm: 'text/html', css: 'text/css',
        js: 'text/javascript', json: 'application/json', xml: 'text/xml',
        csv: 'text/csv', md: 'text/markdown',
        pdf: 'application/pdf',
        zip: 'application/zip', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
      };
      return map[ext] || 'application/octet-stream';
    }

    function fmtSz(b) {
      if (!b) return '';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }

    function fmtDt(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function doSetup() {
      const pw = document.getElementById('pwin').value;
      const pw2 = document.getElementById('pw2in').value;
      document.getElementById('aerr').textContent = '';
      if (!pw) return void (document.getElementById('aerr').textContent = 'Password cannot be empty.');
      if (pw.length < 6) return void (document.getElementById('aerr').textContent = 'Minimum 6 characters.');
      if (pw !== pw2) return void (document.getElementById('aerr').textContent = 'Passwords do not match.');
      const btn = document.getElementById('abtn');
      setBtnLoading(btn, true, 'Creating…');
      try {
        const creds = await setupVault(pw);
        await setMeta('salt', creds.salt);
        await setMeta('iv', creds.iv);
        await setMeta('tok', creds.token);
        await launch();
      } catch (e) {
        document.getElementById('aerr').textContent = 'Error: ' + e.message;
        setBtnLoading(btn, false, 'Create Vault');
      }
    }

    async function doLogin() {
      const lockUntil = await getMeta(LOCKOUT_KEY);
      if (lockUntil && Date.now() < lockUntil) {
        const secs = Math.ceil((lockUntil - Date.now()) / 1000);
        document.getElementById('aerr').textContent = `Locked. Try again in ${secs}s`;
        return;
      }

      const pw = document.getElementById('pwin').value;
      document.getElementById('aerr').textContent = '';
      if (!pw) return void (document.getElementById('aerr').textContent = 'Enter your password.');

      const btn = document.getElementById('abtn');
      setBtnLoading(btn, true, 'Unlocking…');

      try {
        const ok = await unlockVault(pw, await getMeta('salt'), await getMeta('iv'), await getMeta('tok'));
        if (ok) {
          loginAttempts = 0;
          await launch();
        } else {
          loginAttempts++;
          const remaining = MAX_ATTEMPTS - loginAttempts;
          if (loginAttempts >= MAX_ATTEMPTS) {
            await setMeta(LOCKOUT_KEY, Date.now() + LOCKOUT_MS);
            document.getElementById('aerr').textContent = `Too many attempts. Locked for 5 minutes.`;
            btn.disabled = true;
          } else {
            document.getElementById('aerr').textContent = `Incorrect password. ${remaining} attempt${remaining !== 1 ? 's' : ''} remaining.`;
            setBtnLoading(btn, false, 'Unlock');
          }
          document.getElementById('pwin').value = '';
        }
      } catch (e) {
        document.getElementById('aerr').textContent = e.message;
        setBtnLoading(btn, false, 'Unlock');
      }
    }

    // Bucket a sorted item list into labeled groups for "Group By"
    function _groupItems(items, mode) {
      const buckets = new Map(); // label -> items[]
      const order = [];
      function put(label, item) {
        if (!buckets.has(label)) { buckets.set(label, []); order.push(label); }
        buckets.get(label).push(item);
      }
      if (mode === 'type') {
        const kindOf = (it) => {
          if (it.type === 'folder') return 'Folders';
          const m = it.mimeType || '';
          if (m.startsWith('image/')) return 'Images';
          if (m.startsWith('video/')) return 'Videos';
          if (m.startsWith('audio/')) return 'Audio';
          if (m === 'application/pdf') return 'PDF Documents';
          if (m.includes('zip') || m.includes('compressed')) return 'Archives';
          if (m.startsWith('text/') || /\.(md|txt|json|xml|csv|log)$/i.test(it.name)) return 'Documents';
          if (/\.(js|ts|css|py|sh|yaml|yml|jsx|tsx|c|cpp|h|rs|go|rb|php|swift|kt|java)$/i.test(it.name)) return 'Code';
          return 'Other Files';
        };
        const priority = ['Folders', 'Images', 'Videos', 'Audio', 'PDF Documents', 'Documents', 'Code', 'Archives', 'Other Files'];
        items.forEach(it => put(kindOf(it), it));
        order.sort((a, b) => priority.indexOf(a) - priority.indexOf(b));
      } else if (mode === 'date') {
        const now = Date.now();
        const dayMs = 86400000;
        const dateLabel = (it) => {
          const t = it.updatedAt || it.createdAt || 0;
          if (!t) return 'Unknown Date';
          const diffDays = Math.floor((now - t) / dayMs);
          if (diffDays <= 0) return 'Today';
          if (diffDays === 1) return 'Yesterday';
          if (diffDays <= 7) return 'This Week';
          if (diffDays <= 30) return 'This Month';
          return 'Older';
        };
        const priority = ['Today', 'Yesterday', 'This Week', 'This Month', 'Older', 'Unknown Date'];
        items.forEach(it => put(dateLabel(it), it));
        order.sort((a, b) => priority.indexOf(a) - priority.indexOf(b));
      } else {
        return [{ label: '', items }];
      }
      return order.map(label => ({ label, items: buckets.get(label) }));
    }

    async function renderFiles() {
      const fc = document.getElementById('fc');
      if (!fc) return;

      const dov = document.getElementById('dov');
      const selBox = document.getElementById('sel-box');
      // Cleanup virtual scroller if active
      if (fc._vCleanup) { fc._vCleanup(); delete fc._vCleanup; }
      fc.innerHTML = '';
      if (dov) fc.appendChild(dov);
      if (selBox) fc.appendChild(selBox);

      let items = searchMode
        ? [...searchResults]
        : await lsDir(curFolder, showHidden);

      curItems = items;
      selection.setItems(items);

      // Sort
      items = [...items].sort((a, b) => {
        if (!searchMode && a.type !== b.type) return a.type === 'folder' ? -1 : 1;
        let va, vb;
        if (sortBy === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
        else if (sortBy === 'date') { va = a.updatedAt || a.createdAt || 0; vb = b.updatedAt || b.createdAt || 0; }
        else if (sortBy === 'type') { va = a.mimeType || ''; vb = b.mimeType || ''; }
        else { va = a.size || 0; vb = b.size || 0; }
        return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
      });

      updateStatus();

      if (!items.length) {
        const em = mk('div'); em.className = 'empty';
        em.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" style="width:56px;height:56px;opacity:.18">
        <path d="M3 7c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V7z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <p>${searchMode ? 'No results found' : 'This folder is empty'}</p>
      <p style="font-size:12px;color:var(--text3);margin-top:4px">${searchMode ? '' : 'Drag & drop files here or use Upload'}</p>
    `;
        fc.appendChild(em);
        setupDropZone();
        return;
      }

      if (viewMode === 'list' || (viewMode === 'grid' && items.length <= 80)) {
        if (groupBy !== 'none') {
          const groups = _groupItems(items, groupBy);
          groups.forEach(g => {
            const header = mk('div'); header.className = 'fc-group-header';
            header.innerHTML = `<span>${escHtml(g.label)}</span><span class="fc-group-count">${g.items.length}</span>`;
            fc.appendChild(header);
            if (viewMode === 'list') renderListView(g.items, fc);
            else renderGridView(g.items, fc);
          });
        } else if (viewMode === 'list') {
          renderListView(items, fc);
        } else {
          renderGridView(items, fc);
        }
      } else if (viewMode === 'gallery') {
        renderGalleryView(items, fc);
      } else {
        // Use virtual scrolling for large folders (>100 items in grid) —
        // group headers aren't supported here since row math assumes a
        // uniform flat list; grouped sort order is still applied above.
        renderVirtualGridView(items, fc);
      }

      // Media gallery mode for media folders
      const folderMeta = curFolder !== ROOT ? await getFile(curFolder) : null;
      if (folderMeta && ['Pictures', 'Music', 'Videos'].includes(folderMeta.name)) {
        setPreviewItems(items.filter(i => i.type === 'file'));
        // Auto-switch to gallery for photo folders
        if (folderMeta.name === 'Pictures' && viewMode === 'grid') {
          // hint only, don't force
        }
      }

      setupDropZone();
      selection.setupDragSelect(fc);
    }

    function renderGridView(items, fc) {
      const grid = mk('div');
      grid.className = 'fg';
      fc.appendChild(grid);
      const thumbObs = getThumbObserver(getData);
      // Use requestAnimationFrame batching for smooth rendering
      const batchSize = 40;
      let idx = 0;
      function renderBatch() {
        const end = Math.min(idx + batchSize, items.length);
        for (; idx < end; idx++) {
          grid.appendChild(mkGridCard(items[idx], thumbObs));
        }
        if (idx < items.length) requestAnimationFrame(renderBatch);
      }
      renderBatch();
    }

    // Virtual grid view for large folders - only renders visible items
    function renderVirtualGridView(items, fc) {
      const ITEM_W = 108; // item width + gap
      const ITEM_H = 104; // item height + gap
      const PADDING = 10;
      const thumbObs = getThumbObserver(getData);

      const container = mk('div');
      container.style.cssText = 'position:relative;width:100%;';
      fc.appendChild(container);

      let cols = 1, totalHeight = 0, renderedRows = new Set();

      function calcLayout() {
        const w = fc.clientWidth - PADDING * 2;
        cols = Math.max(1, Math.floor(w / ITEM_W));
        const rows = Math.ceil(items.length / cols);
        totalHeight = rows * ITEM_H + PADDING * 2;
        container.style.height = totalHeight + 'px';
      }

      function getVisibleRange() {
        const scrollTop = fc.scrollTop;
        const fcH = fc.clientHeight;
        const overscan = 2;
        const startRow = Math.max(0, Math.floor((scrollTop - PADDING) / ITEM_H) - overscan);
        const endRow = Math.min(Math.ceil(items.length / cols), Math.ceil((scrollTop + fcH - PADDING) / ITEM_H) + overscan);
        return { startRow, endRow };
      }

      function renderVisible() {
        if (!cols) return;
        const { startRow, endRow } = getVisibleRange();
        // Remove out-of-view rows
        container.querySelectorAll('.vrow').forEach(el => {
          const r = parseInt(el.dataset.row);
          if (r < startRow || r >= endRow) el.remove();
        });
        // Add in-view rows
        for (let row = startRow; row < endRow; row++) {
          if (container.querySelector(`[data-row="${row}"]`)) continue;
          const rowEl = mk('div');
          rowEl.className = 'vrow fg';
          rowEl.dataset.row = row;
          rowEl.style.cssText = `position:absolute;top:${PADDING + row * ITEM_H}px;left:${PADDING}px;right:${PADDING}px;display:flex;gap:4px;`;
          const startIdx = row * cols;
          const endIdx = Math.min(startIdx + cols, items.length);
          for (let i = startIdx; i < endIdx; i++) {
            rowEl.appendChild(mkGridCard(items[i], thumbObs));
          }
          container.appendChild(rowEl);
        }
      }

      calcLayout();
      renderVisible();

      const ro = new ResizeObserver(() => { calcLayout(); renderVisible(); });
      ro.observe(fc);
      fc.addEventListener('scroll', renderVisible, { passive: true });
      // Cleanup on next render
      fc._vCleanup = () => { ro.disconnect(); fc.removeEventListener('scroll', renderVisible); };
    }

    // Gallery view - photo-focused grid
    function renderGalleryView(items, fc) {
      const grid = mk('div');
      grid.className = 'gallery-grid';
      fc.appendChild(grid);
      const thumbObs = getThumbObserver(getData);
      const batchSize = 30;
      let idx = 0;
      function renderBatch() {
        const end = Math.min(idx + batchSize, items.length);
        for (; idx < end; idx++) {
          grid.appendChild(mkGalleryCard(items[idx], thumbObs));
        }
        if (idx < items.length) requestAnimationFrame(renderBatch);
      }
      renderBatch();
    }

      const sel = selection.has(item.id);
      const isCut = clip.op === 'cut' && clip.ids.includes(item.id);

      d.dataset.id = item.id;

        const img = mk('img');
        img.alt = item.name;
        img.dataset.thumbId = item.id;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
        d.appendChild(img);
        thumbObs?.observe(img);
      } else {
        const inner = mk('div');
        inner.className = 'gal-non-image';
        inner.innerHTML = getIcon(item.mimeType, item.type) + `<span>${escHtml(item.name)}</span>`;
        d.appendChild(inner);
      }

      const overlay = mk('div'); overlay.className = 'gal-overlay'; d.appendChild(overlay);
      const nameEl = mk('div'); nameEl.className = 'gal-name'; nameEl.textContent = item.name; d.appendChild(nameEl);

      d.onclick = e => { selection.handleItemClick(e, item); resetAutoLock(); };
      d.ondblclick = () => handleItemOpen(item);

      FileDnD.makeDraggableSource(d, item);
      if (item.type === 'folder') FileDnD.makeDropTarget(d, { folderId: item.id });
      return d;
    }

    function renderListView(items, fc) {
      const wrap = mk('div');
      const hdr = mk('div');
      hdr.className = 'fl-hdr';
      const cols = [
        { key: 'name', label: 'Name' },
        { key: 'type', label: 'Type' },
        { key: 'size', label: 'Size' },
        { key: 'date', label: 'Modified' }
      ];
      cols.forEach(col => {
        const span = mk('span');
        span.textContent = col.label + (sortBy === col.key ? (sortDir === 1 ? ' ↑' : ' ↓') : '');
        span.onclick = () => {
          if (sortBy === col.key) sortDir *= -1;
          else { sortBy = col.key; sortDir = 1; }
          renderFiles();
        };
        hdr.appendChild(span);
      });

      list.className = 'fl';

      items.forEach(item => list.appendChild(mkListRow(item, thumbObs)));

    // ── Item actions ──────────────────────────────────────────────
    async function handleItemOpen(item) {
      resetAutoLock();
      if (item.type === 'folder') {
        await nav(item.id);
        return;
      }
      // Track recent
      await addRecent(item.id);

      // HTML app runtime via WM
      if (item.mimeType === 'text/html' || item.name.endsWith('.html') || item.name.endsWith('.htm')) {
        await WM.openHtml(item, getData);
        return;
      }

      // Media → WM window
      if (IMAGE_TYPES.includes(item.mimeType) || VIDEO_TYPES.includes(item.mimeType) || AUDIO_TYPES.includes(item.mimeType)) {
        const siblingImages = IMAGE_TYPES.includes(item.mimeType)
          ? (searchMode ? searchResults : curItems).filter(i => i.type === 'file' && IMAGE_TYPES.includes(i.mimeType))
          : null;
        await WM.openMedia(item, getData, siblingImages);
        return;
      }

      // Text / code → WM text window
      if (TEXT_TYPES.includes(item.mimeType) || /\.(md|json|xml|yaml|yml|csv|log|ini|toml|sh|bat|py|js|ts|css|rb|go|rs|c|cpp|h|swift|kt|java|php)$/i.test(item.name)) {
        await WM.openText(item, getData);
        return;
      }

      // PDF → preview overlay
      if (item.mimeType === 'application/pdf') {
        const previewItems = curItems.filter(i => i.type === 'file');
        await openPreview(item, previewItems);
        return;
      }

      // Default: download
      await downloadItems([item.id]);
    }

    // ── File upload ───────────────────────────────────────────────
    async function uploadFiles(files) {
      if (!files.length) return;

      // Deduplication: filter by name+size to avoid re-uploading identical files
      const existing = await lsDir(curFolder, true);
      const existSet = new Set(existing.map(f => f.name + '|' + f.size));
      const toUpload = files.filter(f => !existSet.has(f.name + '|' + f.size));
      const dupes = files.length - toUpload.length;
      if (!toUpload.length) { toast(`All files already exist (${dupes} skipped)`, 'w'); return; }
      if (dupes) toast(`${dupes} duplicate${dupes > 1 ? 's' : ''} skipped`, 'i');

      // Show upload queue UI
      const uq = document.getElementById('upload-queue');
      const uqList = document.getElementById('uq-list');
      const uqTitle = document.getElementById('uq-title');
      const uqCount = document.getElementById('uq-count');

      const qItems = toUpload.map((f, i) => ({
        file: f,
        el: null,
        progEl: null,
        statusEl: null,
        done: false,
        failed: false
      }));

      if (uq && uqList) {
        uqList.innerHTML = '';
        qItems.slice(0, 6).forEach(qi => {
          const row = document.createElement('div');
          row.className = 'uq-item';
          const nameEl = document.createElement('span'); nameEl.className = 'uq-name'; nameEl.textContent = qi.file.name;
          const progWrap = document.createElement('div'); progWrap.className = 'uq-prog';
          const progFill = document.createElement('div'); progFill.className = 'uq-prog-fill'; progFill.style.width = '0%';
          const statusEl = document.createElement('span'); statusEl.className = 'uq-status'; statusEl.textContent = 'waiting';
          progWrap.appendChild(progFill);
          row.append(nameEl, progWrap, statusEl);
          uqList.appendChild(row);
          qi.el = row; qi.progEl = progFill; qi.statusEl = statusEl;
        });
        if (toUpload.length > 6) {
          const more = document.createElement('div');
          more.style.cssText = 'font-size:11px;color:var(--text3);padding-top:4px';
          more.textContent = `+${toUpload.length - 6} more files`;
          uqList.appendChild(more);
        }
        uq.classList.add('on');
      }

      let done = 0, failed = 0;

      for (let i = 0; i < toUpload.length; i++) {
        const file = toUpload[i];
        const qi = qItems[i];
        if (qi.statusEl) qi.statusEl.textContent = 'uploading';
        if (qi.progEl) qi.progEl.style.width = '20%';
        if (uqTitle) uqTitle.textContent = `Uploading ${i + 1} of ${toUpload.length}…`;
        if (uqCount) uqCount.textContent = `${done} done`;

        try {
          const quota = await checkStorageQuota(file.size);
          if (!quota.ok) {
            toast(quota.reason, 'e'); failed++;
            if (qi.statusEl) { qi.statusEl.textContent = 'skipped'; qi.statusEl.style.color = 'var(--warn)'; }
            if (qi.progEl) qi.progEl.style.background = 'var(--warn)';
            continue;
          }
          if (quota.warn) toast(quota.warn, 'w');

          if (qi.progEl) qi.progEl.style.width = '50%';
          const buf = await file.arrayBuffer();
          if (qi.progEl) qi.progEl.style.width = '75%';
          const fid = uid();
          const mime = file.type || await guessMime(file.name);

          // Handle folder uploads: use webkitRelativePath for folder structure
          let fname = file.name;
          let pid = curFolder;
          if (file.webkitRelativePath && file.webkitRelativePath.includes('/')) {
            const parts = file.webkitRelativePath.split('/');
            fname = parts[parts.length - 1];
            // Create nested folders as needed
            for (let p = 0; p < parts.length - 1; p++) {
              const folderName = parts[p];
              const siblings = await lsDir(pid, true);
              const existingFolder = siblings.find(s => s.type === 'folder' && s.name === folderName);
              if (existingFolder) {
                pid = existingFolder.id;
              } else {
                const newFid = uid();
                await saveFile({ id: newFid, name: folderName, type: 'folder', parentId: pid, mimeType: 'inode/directory', size: 0, createdAt: Date.now(), updatedAt: Date.now() });
                pid = newFid;
              }
            }
          }

          await saveData(fid, buf);
          await saveFile({
            id: fid, name: fname, type: 'file', parentId: pid,
            mimeType: mime, size: file.size, createdAt: Date.now(), updatedAt: Date.now()
          });

          if (qi.progEl) qi.progEl.style.width = '100%';
          if (qi.statusEl) { qi.statusEl.textContent = 'done'; qi.statusEl.style.color = 'var(--success)'; }
        } catch (e) {
          toast(`Failed: ${file.name} — ${e.message}`, 'w');
          failed++;
          if (qi.progEl) { qi.progEl.style.width = '100%'; qi.progEl.style.background = 'var(--danger)'; }
          if (qi.statusEl) { qi.statusEl.textContent = 'error'; qi.statusEl.style.color = 'var(--danger)'; }
        }
        done++;
      }

      // Hide queue after brief delay
      if (uq) setTimeout(() => uq.classList.remove('on'), 1800);

      clearThumbCache();
      await renderAll();
      const total = done - failed;
      toast(`${total} file${total !== 1 ? 's' : ''} uploaded${failed ? `, ${failed} failed` : ''}${dupes ? `, ${dupes} duplicate${dupes > 1 ? 's' : ''} skipped` : ''}`, failed ? 'w' : 's');
    }

    // ── Context menu ──────────────────────────────────────────────
    function setupContextMenu() {
      const ctx = document.getElementById('ctx');
      document.addEventListener('click', () => ctx?.classList.remove('show'));
      document.addEventListener('contextmenu', e => {
        if (!e.target.closest('#fc')) ctx?.classList.remove('show');
      });
    }

    async function showCtxMenu(e, item) {
      e.preventDefault();
      e.stopPropagation();
      resetAutoLock();

      if (!selection.has(item.id)) {
        selection.clear();
        selection.add(item.id);
      }

      const isFolder = item.type === 'folder';
      const isFav = await isFavorite(item.id).catch(() => false);
      const selIds = [...selection.selected];
      const multi = selIds.length > 1;
      const isImage = IMAGE_TYPES.includes(item.mimeType);
      const isZip = item.mimeType === 'application/zip' || item.name.endsWith('.zip');

      const menuItems = [
        !multi && { label: isFolder ? 'Open' : 'Open / Preview', action: () => handleItemOpen(item), icon: '▶' },
        '---',
        { label: 'Rename', action: () => doRename(item), icon: '✏', disabled: multi },
        multi && { label: `Bulk Rename (${selIds.length})`, action: async () => { const its = await Promise.all(selIds.map(id => getFile(id))); doBulkRename(its.filter(Boolean)); }, icon: '📝' },
        { label: 'Copy', action: () => { clip = { ids: selIds, op: 'copy' }; toast(`${selIds.length} item${selIds.length > 1 ? 's' : ''} copied`, 'i'); }, icon: '⧉' },
        { label: 'Cut', action: () => { clip = { ids: selIds, op: 'cut' }; refreshCutVisuals(); toast('Cut', 'i'); }, icon: '✂' },
        clip.ids.length && { label: 'Paste Here', action: () => doPaste(curFolder), icon: '📋' },
        '---',
        { label: isFav ? '★ Remove Favorite' : '☆ Add to Favorites', action: () => doToggleFavorite(item), icon: isFav ? '★' : '☆' },
        { label: 'Edit Tags…', action: () => doEditTags(item), icon: '🏷' },
        item.hidden
          ? { label: 'Unhide', action: () => doToggleHidden(item, false), icon: '👁' }
          : { label: 'Hide', action: () => doToggleHidden(item, true), icon: '🙈' },
        '---',
        { label: 'Download', action: () => downloadItems(selIds), icon: '⬇' },
        { label: 'Zip', action: () => doZip(selIds), icon: '📦' },
        !multi && isZip && { label: 'Extract Here', action: () => doExtract(item.id), icon: '📂' },
        '---',
        { label: 'Properties', action: () => showPropertiesDialog(item), icon: 'ℹ' },

    async function doRename(item) {
      const n = await prompt('Rename', item.type === 'folder' ? 'Folder name:' : 'File name:', item.name);
      if (!n || n === item.name) return;
      try { await patchFile(item.id, { name: n }); await renderAll(); toast('Renamed', 's'); }
      catch (e) { toast('Rename failed: ' + e.message, 'e'); }
    }

    async function doBulkRename(items) {
      if (!items.length) { toast('No files selected', 'w'); return; }
      // Build UI
      let baseName = 'File', startNum = 1, numStyle = 'num', padding = 0, prefix = '', suffix = '', keepExt = true;

      const getExt = n => { const p = n.lastIndexOf('.'); return (p > 0) ? n.slice(p) : ''; };
      const getBase = n => { const p = n.lastIndexOf('.'); return (p > 0) ? n.slice(0, p) : n; };

      function buildNewName(item, index) {
        const ext = keepExt ? getExt(item.name) : '';
        const num = index + startNum;
        let numStr = '';
        if (items.length > 1 || numStyle !== 'none') {
          if (numStyle === 'num') numStr = padding ? String(num).padStart(padding, '0') : String(num);
          else if (numStyle === 'alpha') numStr = String.fromCharCode(96 + num);
          else numStr = '';
        }
        const base = baseName || getBase(item.name);
        const part2 = numStr ? ` (${numStr})` : '';
        return prefix + base + part2 + suffix + ext;
      }

      function buildPreviewHTML() {
        return items.slice(0, 8).map((item, i) => {
          const newName = buildNewName(item, i);
          return `<div class="brn-row">
            <span class="brn-old">${escHtml(item.name)}</span>
            <span class="brn-arrow">→</span>
            <span class="brn-new">${escHtml(newName)}</span>
          </div>`;
        }).join('') + (items.length > 8 ? `<div style="color:var(--text3);font-size:11px;padding-top:4px">…and ${items.length - 8} more</div>` : '');
      }

      const content = `
        <div class="brn-fields">
          <div class="brn-field"><label>Base Name</label><input id="brn-base" value="${escHtml(baseName)}" placeholder="Base name" /></div>
          <div class="brn-field"><label>Start Number</label><input id="brn-start" type="number" value="1" min="1" /></div>
          <div class="brn-field"><label>Numbering</label><select id="brn-style">
            <option value="num">Numeric (1,2,3)</option>
            <option value="alpha">Alpha (a,b,c)</option>
            <option value="none">None</option>
          </select></div>
          <div class="brn-field"><label>Zero Padding</label><input id="brn-pad" type="number" value="0" min="0" max="6" /></div>
        </div>
        <div class="brn-fields">
          <div class="brn-field"><label>Prefix</label><input id="brn-pre" placeholder="prefix_" /></div>
          <div class="brn-field"><label>Suffix</label><input id="brn-suf" placeholder="_suffix" /></div>
        </div>
        <div class="field-check" style="margin-bottom:10px">
          <input type="checkbox" id="brn-ext" checked />
          <label for="brn-ext">Keep file extensions</label>
        </div>
        <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Preview</div>
        <div class="brn-preview" id="brn-prev">${buildPreviewHTML()}</div>
      `;

      return new Promise(resolve => {
        showModal('Bulk Rename', content, [
          { label: 'Cancel', cls: 'sec', action: () => { closeModal(); resolve(false); } },
          {
            label: `Rename ${items.length} Files`, cls: 'pri', action: async () => {
              closeModal();
              showProg('Renaming…', 0);
              for (let i = 0; i < items.length; i++) {
                try {
                  const newName = buildNewName(items[i], i);
                  await patchFile(items[i].id, { name: newName });
                } catch (e) { toast('Error: ' + e.message, 'w'); }
                setProg(Math.round((i + 1) / items.length * 100));
              }
              hideProg();
              await renderAll();
              toast(`Renamed ${items.length} files`, 's');
              resolve(true);
            }
          }
        ]);

        // Wire live preview updates
        const updatePreview = () => {
          baseName = document.getElementById('brn-base')?.value || '';
          startNum = parseInt(document.getElementById('brn-start')?.value) || 1;
          numStyle = document.getElementById('brn-style')?.value || 'num';
          padding = parseInt(document.getElementById('brn-pad')?.value) || 0;
          prefix = document.getElementById('brn-pre')?.value || '';
          suffix = document.getElementById('brn-suf')?.value || '';
          keepExt = document.getElementById('brn-ext')?.checked !== false;
          const prev = document.getElementById('brn-prev');
          if (prev) prev.innerHTML = buildPreviewHTML();
        };
        ['brn-base', 'brn-start', 'brn-style', 'brn-pad', 'brn-pre', 'brn-suf', 'brn-ext'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.addEventListener('input', updatePreview);
        });
      });
    }
