    // ── ZIP operations ────────────────────────────────────────────
    async function doZip(ids) {
      showProg('Creating ZIP…', 0);
      try {
        const entries = [];
        async function collectEntries(id, prefix) {
          const meta = await getFile(id);
          if (!meta) return;
          if (meta.type === 'folder') {
            const kids = await getKids(id);
            for (const kid of kids) await collectEntries(kid.id, prefix + meta.name + '/');
          } else {
            const data = await getData(id);
            entries.push({ name: prefix + meta.name, data });
          }
        }
        let i = 0;
        for (const id of ids) { await collectEntries(id, ''); setProg(Math.round(++i / ids.length * 80)); }

        const zipBuf = await buildZip(entries);
        setProg(90);

        // Find a name
        const first = await getFile(ids[0]);
        const zipName = ids.length === 1 ? (first?.name || 'archive') + '.zip' : 'archive.zip';
        const zipId = uid();
        await saveData(zipId, zipBuf);
        await saveFile({ id: zipId, name: zipName, type: 'file', parentId: curFolder, mimeType: 'application/zip', size: zipBuf.byteLength, createdAt: Date.now(), updatedAt: Date.now() });

        hideProg(); await renderAll(); toast('ZIP created: ' + zipName, 's');
      } catch (e) { hideProg(); toast('ZIP error: ' + e.message, 'e'); }
    }

    async function doExtract(id) {
      showProg('Extracting…', 0);
      try {
        const data = await getData(id);
        const entries = await extractZip(data);
        let done = 0;
        for (const entry of entries) {
          if (entry.isDir) {
            const parts = entry.name.split('/').filter(Boolean);
            let pid = curFolder;
            for (const part of parts) {
              const kids = await getKids(pid);
              let existing = kids.find(k => k.name === part && k.type === 'folder');
              if (!existing) {
                const fid = uid();
                await saveFile({ id: fid, name: part, type: 'folder', parentId: pid, createdAt: Date.now(), updatedAt: Date.now() });
                existing = { id: fid };
              }
              pid = existing.id;
            }
          } else {
            const parts = entry.name.split('/').filter(Boolean);
            const name = parts.pop();
            let pid = curFolder;
            for (const part of parts) {
              const kids = await getKids(pid);
              let existing = kids.find(k => k.name === part && k.type === 'folder');
              if (!existing) {
                const fid = uid();
                await saveFile({ id: fid, name: part, type: 'folder', parentId: pid, createdAt: Date.now(), updatedAt: Date.now() });
                existing = { id: fid };
              }
              pid = existing.id;
            }
            const fid = uid();
            const mime = await guessMime(name);
            await saveData(fid, entry.data);
            await saveFile({ id: fid, name, type: 'file', parentId: pid, mimeType: mime, size: entry.data.byteLength, createdAt: Date.now(), updatedAt: Date.now() });
          }
          done++;
          setProg(Math.round(done / entries.length * 100));
        }
        hideProg(); await renderAll(); toast('Extracted successfully', 's');
      } catch (e) { hideProg(); toast('Extract error: ' + e.message, 'e'); }
    }

    // ── Download ──────────────────────────────────────────────────
    async function downloadItems(ids) {
      if (!ids.length) return;
      showProg('Preparing download…', 0);
      try {
        if (ids.length === 1) {
          const meta = await getFile(ids[0]);
          if (meta && meta.type === 'file') {
            const data = await getData(ids[0]);
            setProg(100);
            triggerDownload(data, meta.name, meta.mimeType);
            hideProg(); toast('Downloading: ' + meta.name, 's'); return;
          }
        }
        // Multiple or folder — zip first
        const entries = [];
        async function collect(id, prefix) {
          const meta = await getFile(id);
          if (!meta) return;
          if (meta.type === 'folder') {
            const kids = await getKids(id);
            for (const kid of kids) await collect(kid.id, prefix + meta.name + '/');
          } else {
            const data = await getData(id);
            entries.push({ name: prefix + meta.name, data });
          }
        }
        for (const id of ids) await collect(id, '');
        setProg(80);
        const zipBuf = await buildZip(entries);
        setProg(100);
        triggerDownload(zipBuf, 'vault_export.zip', 'application/zip');
        hideProg(); toast('Downloading archive…', 's');
      } catch (e) { hideProg(); toast('Download error: ' + e.message, 'e'); }
    }

    // ── Drop zone ─────────────────────────────────────────────────
    function setupDropZone() {
      const fc = document.getElementById('fc');
      const dov = document.getElementById('dov');
      if (!fc) return;
      if (fc._dropZoneWired) return; // fc is reused across renders — wire listeners only once
      fc._dropZoneWired = true;

      let dragCounter = 0;
      fc.addEventListener('dragenter', e => {
        e.preventDefault(); dragCounter++;
        dov?.classList.add('on');
      });
      fc.addEventListener('dragleave', () => {
        dragCounter--;
        if (dragCounter <= 0) { dragCounter = 0; dov?.classList.remove('on'); }
      });
      fc.addEventListener('dragover', e => e.preventDefault());
      fc.addEventListener('drop', async e => {
        e.preventDefault(); dragCounter = 0; dov?.classList.remove('on');
        const items = [...(e.dataTransfer?.items || [])];
        const files = [];
        for (const item of items) {
          if (item.kind === 'file') {
            const f = item.getAsFile();
            if (f) files.push(f);
          }
        }
        if (files.length) await uploadFiles(files);
      });

      // Tapping/clicking empty background clears selection and exits touch multi-select mode
      fc.addEventListener('click', e => {
        if (e.target.closest('.fi, .fl-row, .gal-item, .cb-btn, .nav-btn')) return;
        if (FileDnD.isSelectMode()) FileDnD.exitSelectMode();
        else selection.clear();
      });
    }

    // ── Keyboard shortcuts ────────────────────────────────────────
    function setupKeyboard() {
      document.addEventListener('keydown', async e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        resetAutoLock();

        if (handlePreviewKey(e)) return;

        const ctrl = e.ctrlKey || e.metaKey;
        const selIds = [...selection.selected];

        if (ctrl && e.key === 'c') { clip = { ids: selIds, op: 'copy' }; if (selIds.length) toast('Copied', 'i'); }
        if (ctrl && e.key === 'x') { clip = { ids: selIds, op: 'cut' }; if (selIds.length) { refreshCutVisuals(); toast('Cut', 'i'); } }
        if (ctrl && e.key === 'v') await doPaste(curFolder);
        if (ctrl && e.key === 'a') { e.preventDefault(); selection.selectAll(); }
        if (ctrl && e.key === 'n') { e.preventDefault(); await doNewFolder(); }

        if (e.key === 'Delete' && selIds.length) await doDelete(selIds);
        if (e.key === 'F2' && selIds.length === 1) {
          const m = await getFile(selIds[0]); if (m) await doRename(m);
        }
        if (e.key === 'F5') {
          e.preventDefault(); clearThumbCache(); await renderAll(); toast('Refreshed', 'i');
        }
        if (e.key === 'Escape') {
          selection.clear();
          document.getElementById('ctx')?.classList.remove('show');
        }
        if (e.key === 'Backspace' && curFolder !== ROOT) {
          const path = await getPath(curFolder);
          nav(path.length > 1 ? path[path.length - 2].id : ROOT);
        }
        if (e.altKey && e.key === 'ArrowLeft') document.getElementById('btn-back')?.click();
        if (e.altKey && e.key === 'ArrowRight') document.getElementById('btn-fwd')?.click();
        if (e.altKey && e.key === 'Enter' && selIds.length) {
          const m = await getFile(selIds[0]); if (m) showPropertiesDialog(m);
        }
      });
    }

    // ── Auto-lock ─────────────────────────────────────────────────
    function setupAutoLock() {
      resetAutoLock();
    }

    function resetAutoLock() {
      clearInterval(autoLockTimer);
      autoLockRemaining = AUTO_LOCK_SECS;
      updateLockBar();

      autoLockTimer = setInterval(() => {
        autoLockRemaining--;
        updateLockBar();
        if (autoLockRemaining <= 0) {
          clearInterval(autoLockTimer);
          lockApp();
        }
      }, 1000);
    }

    function updateLockBar() {
      const bar = document.getElementById('autolock-bar');
      if (!bar) return;
      const pct = (autoLockRemaining / AUTO_LOCK_SECS) * 100;
      bar.style.width = pct + '%';
      bar.style.background = pct > 30 ? 'var(--accent)' : pct > 10 ? 'var(--warn)' : 'var(--danger)';
    }

    function lockApp() {
      lockVault();
      clearThumbCache();
      selection.clear();
      initialized = false;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('auth').classList.remove('hidden');
      document.getElementById('pwin').value = '';
      document.getElementById('aerr').textContent = '';
      document.getElementById('abtn').disabled = false;
      document.getElementById('abtn').textContent = 'Unlock';
      showLogin();
    }

    // ── Hidden vault ──────────────────────────────────────────────
    async function handleOpenHiddenVault() {
      // Guard: if we're somehow already in hidden-vault mode (e.g. a previous
      // exit failed to clear the flag), treat this as an exit instead of
      // trying to re-enter — this is what used to leave the toggle "stuck".
      if (hiddenVaultMode) { exitHiddenVault(); return; }
      await openHiddenVault({
        onEnter: () => {
          hiddenVaultMode = true;
          curFolder = HIDDEN_VAULT_ROOT;
          nav(HIDDEN_VAULT_ROOT);
          document.getElementById('app').style.setProperty('--accent', '#8b5cf6');
          document.getElementById('hv-exit-banner')?.classList.add('on');
          document.getElementById('btn-hvault')?.classList.add('on');
          toast('🔒 Hidden Vault Active', 'i');
        }
      });
    }

    function exitHiddenVault(alsoLock = true) {
      hiddenVaultMode = false;
      document.getElementById('app').style.removeProperty('--accent');
      document.getElementById('hv-exit-banner')?.classList.remove('on');
      document.getElementById('btn-hvault')?.classList.remove('on');
      if (alsoLock) closeHiddenVault(); // re-lock so it never lingers unlocked
      nav(ROOT);
      toast('Hidden Vault locked', 'i');
    }

    // ── Change password ───────────────────────────────────────────
    async function changeMainPassword() {
      const currentPw = await promptPassword('Verify Current Password', { label: 'Current Password' });
      if (!currentPw) return;
      const ok = await unlockVault(currentPw, await getMeta('salt'), await getMeta('iv'), await getMeta('tok'));
      if (!ok) { toast('Incorrect password', 'e'); return; }

      const newPw = await promptPassword('Set New Password', { confirm: true, label: 'New Password', checkStrength: checkPasswordStrength });
      if (!newPw) return;

      try {
        // Collect all decrypted file data BEFORE changing the key
        showProg('Reading files…', 0);
        const allF = await allFiles();
        const decrypted = [];
        for (let i = 0; i < allF.length; i++) {
          const f = allF[i];
          if (f.type === 'file') {
            const enc = await getBlob(f.id);
            if (enc) {
              try { decrypted.push({ id: f.id, data: await decrypt(enc) }); } catch { }
            }
          }
          setProg(Math.round(i / allF.length * 40));
        }
        // Change vault credentials (switches _sessionKey to new key)
        const creds = await setupVault(newPw);
        await setMeta('salt', creds.salt);
        await setMeta('iv', creds.iv);
        await setMeta('tok', creds.token);
        // Re-encrypt every file with the new key
        for (let i = 0; i < decrypted.length; i++) {
          const { id, data } = decrypted[i];
          await saveBlob(id, await encrypt(data));
          setProg(40 + Math.round(i / decrypted.length * 60));
        }
        hideProg();
        toast('Password changed — ' + decrypted.length + ' file(s) re-encrypted', 's');
        resetAutoLock();
      } catch (e) { hideProg(); toast('Failed: ' + e.message, 'e'); }
    }

    // ── Search ────────────────────────────────────────────────────
    let searchDebounce = null;
    function setupSearch() {
      const input = document.getElementById('srch');
      if (!input) return;
      input.addEventListener('input', () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(async () => {
          const q = input.value.trim();
          if (!q) { searchMode = false; searchResults = []; await renderFiles(); return; }
          searchMode = true;
          searchResults = await searchFiles(q, showHidden);
          await renderFiles();
        }, 250);
      });
    }

    // ── Icons ─────────────────────────────────────────────────────
    function getIcon(mime, type) {
      if (type === 'folder') return `<svg viewBox="0 0 24 24" fill="none"><path d="M3 7c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V7z" fill="#FFB900" opacity=".9"/><path d="M3 9h18v8c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V9z" fill="#FFD000"/></svg>`;
      if (!mime) return fileIcon();
      if (mime.startsWith('image/')) return `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" fill="#0EA5E9" opacity=".12"/><rect x="3" y="3" width="18" height="18" rx="2" stroke="#0EA5E9" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" fill="#0EA5E9"/><path d="M5 17l4-5 3 4 2-2 4 3H5z" fill="#0EA5E9"/></svg>`;
      if (mime.startsWith('video/')) return `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="15" height="16" rx="2" fill="#A855F7" opacity=".12"/><rect x="2" y="4" width="15" height="16" rx="2" stroke="#A855F7" stroke-width="1.5"/><path d="M17 9l5-2v10l-5-2V9z" fill="#A855F7" opacity=".85"/><path d="M7 10l4 2-4 2v-4z" fill="#A855F7"/></svg>`;
      if (mime.startsWith('audio/')) return `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" fill="#EC4899" opacity=".1"/><circle cx="12" cy="12" r="4" stroke="#EC4899" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="#EC4899"/></svg>`;
      if (mime === 'application/pdf') return `<svg viewBox="0 0 24 24" fill="none"><path d="M3 4a2 2 0 012-2h9l5 5v13a2 2 0 01-2 2H5a2 2 0 01-2-2V4z" stroke="#EF4444" stroke-width="1.5" fill="#EF4444" fill-opacity=".08"/><path d="M12 2v5h5" stroke="#EF4444" stroke-width="1.5"/><text x="5.5" y="18.5" font-size="5.5" font-family="monospace" fill="#EF4444" font-weight="bold">PDF</text></svg>`;
      if (mime.includes('zip') || mime.includes('compressed')) return `<svg viewBox="0 0 24 24" fill="none"><path d="M3 4a2 2 0 012-2h9l5 5v13a2 2 0 01-2 2H5a2 2 0 01-2-2V4z" stroke="#F59E0B" stroke-width="1.5" fill="#F59E0B" fill-opacity=".08"/><path d="M12 2v5h5" stroke="#F59E0B" stroke-width="1.5"/></svg>`;
      if (mime.startsWith('text/')) return `<svg viewBox="0 0 24 24" fill="none"><path d="M3 4a2 2 0 012-2h9l5 5v13a2 2 0 01-2 2H5a2 2 0 01-2-2V4z" stroke="#64748B" stroke-width="1.5"/><path d="M12 2v5h5" stroke="#64748B" stroke-width="1.5"/><line x1="7" y1="13" x2="15" y2="13" stroke="#64748B" stroke-width="1.3"/><line x1="7" y1="16" x2="13" y2="16" stroke="#64748B" stroke-width="1.3"/></svg>`;
      return fileIcon();
    }

    function fileIcon() {
      return `<svg viewBox="0 0 24 24" fill="none"><path d="M3 4a2 2 0 012-2h9l5 5v13a2 2 0 01-2 2H5a2 2 0 01-2-2V4z" stroke="#8B8FA8" stroke-width="1.5"/><path d="M12 2v5h5" stroke="#8B8FA8" stroke-width="1.5"/></svg>`;
    }

    // ── Toolbar button wiring ─────────────────────────────────────
    function wireToolbar() {
      document.getElementById('btn-back').onclick = () => {
        if (navIdx > 0) { navIdx--; nav(navHistory[navIdx], false); }
      };
      document.getElementById('btn-fwd').onclick = () => {
        if (navIdx < navHistory.length - 1) { navIdx++; nav(navHistory[navIdx], false); }
      };
      document.getElementById('btn-up').onclick = async () => {
        if (curFolder === ROOT) return;
        const path = await getPath(curFolder);
        nav(path.length > 1 ? path[path.length - 2].id : ROOT);
      };
      // document.getElementById('btn-reload').onclick = async () => {
      //   clearThumbCache(); await renderAll(); toast('Refreshed', 'i');
      // };
      document.getElementById('btn-lock').onclick = lockApp;

      const viewModeBtn = document.getElementById('view-mode-btn');
      const viewModeMenu = document.getElementById('view-menu');
      const viewModeLabel = document.getElementById('view-mode-label');
      const setViewMode = (mode, render = true) => {
        viewMode = mode;
        const labels = { grid: 'Grid', list: 'List', gallery: 'Gallery' };
        viewModeLabel.textContent = labels[mode] || 'Grid';
        document.querySelectorAll('.view-option').forEach(opt => opt.classList.toggle('on', opt.dataset.view === mode));
        viewModeBtn.classList.toggle('on', true);
        if (render) renderFiles();
      };

      function positionViewMenu() {
        const r = viewModeBtn.getBoundingClientRect();
        // Measure menu (it must be display:flex briefly to measure — handled by caller)
        const mw = viewModeMenu.offsetWidth || 180;
        let left = r.right - mw;
        let top = r.bottom + 8;
        const pad = 6;
        if (left + mw > window.innerWidth - pad) left = window.innerWidth - mw - pad;
        if (left < pad) left = pad;
        if (top + viewModeMenu.offsetHeight > window.innerHeight - pad) {
          top = r.top - viewModeMenu.offsetHeight - 8; // flip above if no room below
        }
        viewModeMenu.style.left = left + 'px';
        viewModeMenu.style.top = top + 'px';
      }

      function openViewMenu() {
        viewModeMenu.classList.add('show');
        positionViewMenu();
      }
      function closeViewMenu() {
        viewModeMenu.classList.remove('show');
      }

      viewModeBtn.onclick = (e) => {
        e.stopPropagation();
        if (viewModeMenu.classList.contains('show')) closeViewMenu();
        else openViewMenu();
      };

      document.querySelectorAll('.view-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          setViewMode(opt.dataset.view);
          closeViewMenu();
        };
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.view-switcher') && !e.target.closest('.view-menu')) closeViewMenu();
      });
      window.addEventListener('resize', () => { if (viewModeMenu.classList.contains('show')) positionViewMenu(); });
      document.getElementById('toolbar')?.addEventListener('scroll', () => { if (viewModeMenu.classList.contains('show')) positionViewMenu(); }, { passive: true });

      setViewMode(viewMode, false);

      // Show hidden toggle
      document.getElementById('btn-hidden').onclick = () => {
        showHidden = !showHidden;
        document.getElementById('btn-hidden').classList.toggle('on', showHidden);
        renderFiles();
      };

      // Command bar
      document.getElementById('btn-nf').onclick = doNewFolder;
      document.getElementById('btn-ul').onclick = () => document.getElementById('fup').click();
      document.getElementById('btn-uldir').onclick = () => document.getElementById('fup-dir').click();
      document.getElementById('btn-rn').onclick = async () => {
        const selIds = [...selection.selected];
        if (selIds.length !== 1) return;
        const m = await getFile(selIds[0]); if (m) doRename(m);
      };
      document.getElementById('btn-brn').onclick = async () => {
        const selIds = [...selection.selected];
        if (selIds.length < 2) { toast('Select multiple files to bulk rename', 'w'); return; }
        const items = await Promise.all(selIds.map(id => getFile(id)));
        doBulkRename(items.filter(Boolean));
      };
      document.getElementById('btn-del').onclick = () => doDelete([...selection.selected]);
      document.getElementById('btn-cp').onclick = () => { clip = { ids: [...selection.selected], op: 'copy' }; toast('Copied', 'i'); };
      document.getElementById('btn-cut').onclick = () => { clip = { ids: [...selection.selected], op: 'cut' }; refreshCutVisuals(); toast('Cut', 'i'); };
      document.getElementById('btn-pst').onclick = () => doPaste(curFolder);
      document.getElementById('btn-zip').onclick = () => doZip([...selection.selected]);
      document.getElementById('btn-unzip').onclick = async () => {
        const selIds = [...selection.selected];
        if (selIds.length !== 1) return;
        const m = await getFile(selIds[0]);
        if (m && (m.mimeType === 'application/zip' || m.name.endsWith('.zip'))) doExtract(m.id);
      };
      document.getElementById('btn-dl').onclick = () => downloadItems([...selection.selected]);
      document.getElementById('btn-props').onclick = async () => {
        const selIds = [...selection.selected];
        if (!selIds.length) return;
        const m = await getFile(selIds[0]); if (m) showPropertiesDialog(m);
      };
      document.getElementById('btn-chpw').onclick = changeMainPassword;
      document.getElementById('btn-hvault').onclick = handleOpenHiddenVault;
      document.getElementById('hv-exit-btn').onclick = () => exitHiddenVault(true);
      const mselBtn = document.getElementById('btn-mselect');
      mselBtn.onclick = () => {
        if (FileDnD.isSelectMode()) FileDnD.exitSelectMode();
        else FileDnD.enterSelectMode();
      };

      // File input
      document.getElementById('fup').onchange = e => {
        uploadFiles([...e.target.files]);
        e.target.value = '';
      };
      document.getElementById('fup-dir').onchange = e => {
        uploadFiles([...e.target.files]);
        e.target.value = '';
      };

      // Sidebar items
      document.getElementById('sb-home').onclick = () => nav(ROOT);
      FileDnD.makeDropTarget(document.getElementById('sb-home'), { folderId: ROOT });
      document.querySelectorAll('[data-cat]').forEach(el => {
        el.onclick = async () => {
          const kids = await getKids(ROOT);
          const folder = kids.find(k => k.name === el.dataset.cat && k.type === 'folder');
          if (folder) nav(folder.id);
        };
        FileDnD.makeDropTarget(el, {
          getFolderId: async () => {
            const kids = await getKids(ROOT);
            const folder = kids.find(k => k.name === el.dataset.cat && k.type === 'folder');
            return folder?.id || null;
          }
        });
      });
      FileDnD.makeDropTarget(document.getElementById('btn-hvault'), { toHiddenVault: true });

      // Search
      setupSearch();
    }

    // ── Service Worker (PWA offline) ──────────────────────────────
    function registerSW() {
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        try {
          const sw = `
        const C='sv14';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(C).then(c => c.addAll(['./'])).then(() => self.skipWaiting()));
        });
        self.addEventListener('activate', e => {
          e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== C).map(k => caches.delete(k)))).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
        });
      `;
          const url = URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }));
          navigator.serviceWorker.register(url).catch(() => { });
        } catch { }
      }
    }

    // ── Scroll to top button ──────────────────────────────────────
    function initScrollTopBtn() {
      const fc = document.getElementById('fc');
      const btn = document.getElementById('scroll-top-btn');
      if (!fc || !btn) return;
      fc.addEventListener('scroll', () => {
        btn.classList.toggle('on', fc.scrollTop > 300);
      }, { passive: true });
      btn.onclick = () => fc.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Mobile Bottom Sheet (replaces context menu on mobile) ─────
    function initBottomSheet() {
      const overlay = document.getElementById('bs-overlay');
      const sheet = document.getElementById('bottom-sheet');
      if (!overlay || !sheet) return;
      overlay.onclick = closeBs;
      // Handle drag-to-dismiss
      let startY = 0, dragging = false;
      sheet.addEventListener('touchstart', e => {
        if (e.target.closest('.bs-handle')) { startY = e.touches[0].clientY; dragging = true; }
      }, { passive: true });
      sheet.addEventListener('touchmove', e => {
        if (!dragging) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
      }, { passive: true });
      sheet.addEventListener('touchend', e => {
        if (!dragging) return;
        dragging = false;
        const dy = e.changedTouches[0].clientY - startY;
        if (dy > 60) closeBs();
        else sheet.style.transform = '';
      });
    }

    function showBs(items) {
      const overlay = document.getElementById('bs-overlay');
      const sheet = document.getElementById('bottom-sheet');
      const container = document.getElementById('bs-items');
      if (!sheet || !container) return;
      container.innerHTML = '';
      sheet.style.transform = '';
      items.forEach(item => {
        if (item === 'sep') {
          const sep = document.createElement('div');
          sep.className = 'bs-sep';
          container.appendChild(sep);
          return;
        }
        const btn = document.createElement('button');
        btn.className = 'bs-item' + (item.danger ? ' danger' : '');
        btn.innerHTML = (item.icon || '') + `<span>${item.label}</span>`;
        btn.onclick = () => { closeBs(); item.action(); };
        container.appendChild(btn);
      });
      overlay.classList.add('on');
      sheet.classList.add('on');
    }

    function closeBs() {
      document.getElementById('bs-overlay')?.classList.remove('on');
      const sheet = document.getElementById('bottom-sheet');
      if (sheet) { sheet.classList.remove('on'); sheet.style.transform = ''; }
    }

    // Detect mobile for bottom sheet vs context menu
    const isMobileDevice = () => window.innerWidth <= 640 || navigator.maxTouchPoints > 0;

    // ── Bootstrap ─────────────────────────────────────────────────
    // ← boot() called at bottom of script


    // ── Bootstrap ─────────────────────────────────────────────────────────
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () {
        wireToolbar();
        registerSW();
        initScrollTopBtn();
        initBottomSheet();
        boot();
      });
    } else {
      wireToolbar();
      registerSW();
      initScrollTopBtn();
      initBottomSheet();
      boot();
    }

  </script>
