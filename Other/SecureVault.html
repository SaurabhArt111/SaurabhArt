<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta name="theme-color" content="#12131a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>SecureVault</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    :root {
      --taskbar-h: 60px;
      --bg: #12131a;
      --surface: #1c1d26;
      --surface2: #22232e;
      --surface3: #2a2b38;
      --surface4: #333447;
      --border: rgba(255, 255, 255, .065);
      --border2: rgba(255, 255, 255, .10);
      --border3: rgba(255, 255, 255, .17);
      --accent: #4f8ef7;
      --accent-h: #6ba3ff;
      --accent-dim: rgba(79, 142, 247, .14);
      --accent-sel: rgba(79, 142, 247, .11);
      --text: #e2e4ef;
      --text2: #9097b2;
      --text3: #565d7a;
      --danger: #f0536e;
      --success: #3ecf8e;
      --warn: #f0a840;
      --sidebar-w: 232px;
      --toolbar-h: 48px;
      --cmdbar-h: 40px;
      --status-h: 24px;
      --radius: 10px;
      --rsm: 6px;
      --shadow: 0 8px 32px rgba(0, 0, 0, .7);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, .4);
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
      --tr: .13s ease;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── AUTO LOCK BAR ── */
    #autolock-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--accent);
      transition: width 1s linear, background .5s;
      z-index: 99999;
      pointer-events: none;
    }

    /* ── AUTH ── */
    #auth {
      position: fixed;
      inset: 0;
      z-index: 9999;
      z-index: 9999;
      background: radial-gradient(ellipse at 40% 40%, #1a1e35 0%, #0e0f16 60%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #auth.hidden {
      display: none;
    }

    .abox {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 44px 44px 36px;
      width: 390px;
      max-width: 93vw;
      box-shadow: 0 28px 72px rgba(0, 0, 0, .8), 0 0 0 1px rgba(79, 142, 247, .08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: popIn .4s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.96);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .a-logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #2563eb, #4f8ef7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 32px rgba(79, 142, 247, .4);
    }

    .a-logo svg {
      width: 36px;
      height: 36px;
    }

    .a-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .a-sub {
      font-size: 12px;
      color: var(--text3);
      text-align: center;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .a-field {
      width: 100%;
      margin-bottom: 10px;
    }

    .a-field label {
      display: block;
      font-size: 11.5px;
      color: var(--text2);
      margin-bottom: 5px;
      font-weight: 500;
    }

    .a-field input {
      width: 100%;
      background: var(--surface3);
      border: 1.5px solid var(--border2);
      border-radius: var(--rsm);
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color .18s;
    }

    .a-field input:focus {
      border-color: var(--accent);
    }

    .a-err {
      color: var(--danger);
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }

    .a-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--rsm);
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(79, 142, 247, .35);
    }

    .a-btn:hover:not(:disabled) {
      background: var(--accent-h);
      box-shadow: 0 6px 20px rgba(79, 142, 247, .45);
    }

    .a-btn:active:not(:disabled) {
      transform: scale(.98);
    }

    .a-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* Strength bar */
    #pw-strength-wrap {
      width: 100%;
      display: none;
    }

    .pw-strength-track {
      height: 4px;
      border-radius: 2px;
      background: var(--surface3);
      overflow: hidden;
    }

    #pw-strength {
      height: 100%;
      width: 0;
      transition: width .3s, background .3s;
      border-radius: 2px;
    }

    #pw-strength-label {
      font-size: 11px;
      color: var(--text3);
      text-align: right;
      margin-top: 3px;
    }

    /* ── APP LAYOUT ── */
    #app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--toolbar-h) var(--cmdbar-h) 1fr var(--status-h);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    #app.hidden {
      display: none;
    }

    /* ── TOOLBAR ── */
    #toolbar {
      grid-column: 1/-1;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 2px;
      flex-shrink: 0;
    }

    .tb-nav-btns {
      display: flex;
      align-items: center;
      gap: 1px;
      margin-right: 4px;
    }

    .nav-btn {
      width: 30px;
      height: 30px;
      border-radius: var(--rsm);
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--tr), color var(--tr);
    }

    .nav-btn:hover:not(.dis) {
      background: var(--surface3);
      color: var(--text);
    }

    .nav-btn.dis {
      opacity: .28;
      pointer-events: none;
    }

    .nav-btn svg {
      width: 15px;
      height: 15px;
    }

    .tb-addr {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface3);
      border: 1.5px solid var(--border2);
      border-radius: var(--rsm);
      padding: 3px 10px;
      min-width: 0;
      height: 29px;
      gap: 5px;
      transition: border-color .18s;
      margin: 0 4px;
    }

    .tb-addr:focus-within {
      border-color: var(--accent);
    }

    #addr-display {
      flex: 1;
      font-size: 12.5px;
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .a-crumb {
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
    }

    .a-crumb:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .a-sep {
      color: var(--text3);
      margin: 0 2px;
    }

    .tb-search {
      display: flex;
      align-items: center;
      background: var(--surface3);
      border: 1.5px solid var(--border2);
      border-radius: 20px;
      padding: 3px 12px;
      gap: 6px;
      height: 29px;
      transition: border-color .18s;
      flex-shrink: 0;
    }

    .tb-search:focus-within {
      border-color: var(--accent);
    }

    .tb-search svg {
      width: 13px;
      height: 13px;
      color: var(--text3);
      flex-shrink: 0;
    }

    .tb-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12.5px;
      font-family: var(--font);
      width: 160px;
    }

    .tb-search input::placeholder {
      color: var(--text3);
    }

    .tb-right {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
    }

    .view-switcher {
      position: relative;
      display: flex;
      align-items: center;
    }

    .vtoggle,
    .lock-btn,
    .view-option {
      padding: 5px 8px;
      border-radius: var(--rsm);
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-family: var(--font);
      transition: background var(--tr), color var(--tr);
    }

    .vtoggle:hover,
    .lock-btn:hover,
    .view-option:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .vtoggle.on,
    .view-option.on {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .vtoggle svg,
    .lock-btn svg,
    .view-option svg {
      width: 15px;
      height: 15px;
    }

    .view-menu {
      /* Positioned via JS as position:fixed so it can never be clipped by
         #toolbar's overflow-y:hidden (needed for horizontal toolbar
         scrolling on narrow screens). Left/top are set dynamically. */
      position: fixed;
      top: 0;
      left: 0;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 180px;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .35);
      z-index: 999999;
      overflow: visible;
    }

    .view-menu.show {
      display: flex;
    }

    .view-option {
      justify-content: flex-start;
      width: 100%;
      padding: 7px 8px;
      text-align: left;
    }

    #sb-toggle {
      display: none;
    }

    /* ── COMMAND BAR ── */
    #cmdbar {
      grid-column: 1/-1;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 1px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    #cmdbar::-webkit-scrollbar {
      display: none;
    }

    .cmd-grp {
      display: flex;
      align-items: center;
      gap: 1px;
      padding-right: 8px;
      margin-right: 4px;
      border-right: 1px solid var(--border2);
    }

    .cmd-grp:last-child {
      border-right: none;
    }

    .cb-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: var(--rsm);
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font);
      white-space: nowrap;
      transition: background var(--tr), color var(--tr);
    }

    .cb-btn:hover:not(.dis) {
      background: var(--surface3);
      color: var(--text);
    }

    .cb-btn.dis {
      opacity: .3;
      pointer-events: none;
    }

    /* Multi-select toggle: touch devices only — desktop already has marquee + ctrl/shift-click */
    #btn-mselect {
      display: none;
    }

    @media (pointer: coarse) {
      #btn-mselect {
        display: flex;
      }
    }

    #btn-mselect.active {
      background: var(--accent-dim);
      color: var(--accent-h);
    }

    .cb-btn.danger:hover {
      background: rgba(240, 83, 110, .13);
      color: var(--danger);
    }

    .cb-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      grid-column: 1;
      grid-row: 3 / 5;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    #sidebar::-webkit-scrollbar {
      width: 3px;
    }

    #sidebar::-webkit-scrollbar-thumb {
      background: var(--surface3);
      border-radius: 3px;
    }

    .sb-section {
      padding: 14px 10px 4px;
    }

    .sb-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text3);
      padding: 0 4px;
      margin-bottom: 4px;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--rsm);
      cursor: pointer;
      color: var(--text2);
      font-size: 12.5px;
      transition: background var(--tr), color var(--tr);
      font-weight: 500;
    }

    .sb-item:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .sb-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .sb-ico {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sb-ico svg {
      width: 16px;
      height: 16px;
    }

    .sb-sep {
      height: 1px;
      background: var(--border);
      margin: 6px 10px;
    }

    /* ── FILE CONTAINER ── */
    #fc {
      position: relative;
      grid-row: 3;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      padding: 10px;
    }

    #fc {
      grid-column: 2;
      grid-row: 3;
      min-width: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #fc::-webkit-scrollbar {
      width: 5px;
    }

    /* Group headers (Group By feature) */
    .fc-group-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 4px 6px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--text3);
    }

    .fc-group-header:first-child {
      padding-top: 2px;
    }

    .fc-group-count {
      font-weight: 400;
      text-transform: none;
      color: var(--text3);
      opacity: .7;
      font-size: 11px;
    }

    #fc::-webkit-scrollbar-thumb {
      background: var(--surface3);
      border-radius: 4px;
    }

    /* Grid view */
    .fg {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 100px));
      justify-content: start;
      gap: 4px;
    }

    .fi {
      width: 100px;
      padding: 8px 6px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1.5px solid transparent;
      text-align: center;
      transition: background var(--tr), border-color var(--tr);
      position: relative;
    }

    .fi:hover {
      background: var(--surface2);
    }

    .fi.sel {
      background: var(--accent-sel);
      border-color: var(--accent);
    }

    .fi.cut {
      opacity: .45;
    }

    .fi.hidden-item {
      opacity: .5;
    }

    .fi-ic {
      width: 56px;
      height: 56px;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fi-ic img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
    }

    .fi-ic svg {
      width: 50px;
      height: 50px;
    }

    .fi-nm {
      font-size: 11.5px;
      color: var(--text);
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    /* List view */
    .fl-hdr {
      display: grid;
      grid-template-columns: 1fr 100px 80px 110px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .fl-hdr span:hover {
      color: var(--text);
    }

    .fl {
      display: flex;
      flex-direction: column;
    }

    .fl-row {
      display: grid;
      grid-template-columns: 1fr 100px 80px 110px;
      align-items: center;
      padding: 6px 12px;
      border-radius: var(--rsm);
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background var(--tr), border-color var(--tr);
    }

    .fl-row:hover {
      background: var(--surface2);
    }

    .fl-row.sel {
      background: var(--accent-sel);
      border-color: rgba(79, 142, 247, .3);
    }

    .fl-row.cut {
      opacity: .45;
    }

    .fl-row.hidden-item {
      opacity: .5;
    }

    .fnc {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .lic {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lic img {
      width: 20px;
      height: 20px;
      object-fit: cover;
      border-radius: 3px;
    }

    .lic svg {
      width: 20px;
      height: 20px;
    }

    .lnm {
      font-size: 12.5px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .ltp {
      font-size: 11.5px;
      color: var(--text3);
    }

    .lsz {
      font-size: 11.5px;
      color: var(--text3);
      font-family: var(--mono);
    }

    .ldt {
      font-size: 11.5px;
      color: var(--text3);
    }

    /* Gallery view */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    .gal-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface2);
    }

    .gal-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gal-item:hover .gal-overlay {
      background: rgba(0, 0, 0, .4);
    }

    .gal-overlay svg {
      opacity: 0;
      transition: opacity .2s;
      width: 32px;
      height: 32px;
    }

    .gal-item:hover .gal-overlay svg {
      opacity: 1;
    }

    .gal-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, .75));
      padding: 20px 8px 6px;
      font-size: 11px;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text3);
      min-height: 240px;
    }

    .empty p {
      font-size: 14px;
      color: var(--text2);
    }

    /* ── SELECTION BOX ── */
    #sel-box {
      position: absolute;
      border: 1.5px solid var(--accent);
      background: var(--accent-sel);
      border-radius: 4px;
      pointer-events: none;
      display: none;
      z-index: 100;
    }

    /* ── DROP OVERLAY ── */
    #dov {
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: var(--accent-dim);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      gap: 10px;
      flex-direction: column;
    }

    #dov.on {
      display: flex;
    }

    #dov svg {
      width: 40px;
      height: 40px;
      opacity: .6;
    }

    /* ── STATUS BAR ── */
    #statusbar {
      grid-column: 1/-1;
      grid-row: 4;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 16px;
      font-size: 11px;
      color: var(--text3);
    }

    #sb-info {
      flex: 1;
    }

    /* ── CONTEXT MENU ── */
    #ctx {
      position: fixed;
      z-index: 8000;
      background: var(--surface2);
      border: 1px solid var(--border3);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .65);
      padding: 5px;
      min-width: 190px;
      opacity: 0;
      transform: scale(.94) translateY(-4px);
      pointer-events: none;
      transition: opacity .12s, transform .12s;
    }

    #ctx.show {
      opacity: 1;
      transform: none;
      pointer-events: all;
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border-radius: 6px;
      width: 100%;
      border: none;
      background: none;
      text-align: left;
      font-size: 12.5px;
      font-family: var(--font);
      color: var(--text2);
      cursor: pointer;
      transition: background var(--tr), color var(--tr);
    }

    .ctx-item:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .ctx-item.danger:hover {
      background: rgba(240, 83, 110, .13);
      color: var(--danger);
    }

    .ctx-item.dis {
      opacity: .35;
      pointer-events: none;
    }

    .ctx-ico {
      font-size: 14px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .ctx-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Accordion-style submenus (View / Sort by / Group by / New / Show more) */
    #ctx-body.ctx-has-sub {
      max-height: min(70vh, 520px);
      overflow-y: auto;
    }

    .ctx-item-parent {
      position: relative;
    }

    .ctx-chevron {
      margin-left: auto;
      color: var(--text3);
      transition: transform .15s;
      font-size: 14px;
    }

    .ctx-group.open .ctx-chevron {
      transform: rotate(90deg);
      color: var(--accent);
    }

    .ctx-submenu {
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 2px 0 2px 8px;
      margin: 2px 0 2px 14px;
      border-left: 1px solid var(--border);
    }

    .ctx-group.open .ctx-submenu {
      display: flex;
    }

    .ctx-item-sub {
      font-size: 12px;
      padding: 6px 10px;
    }

    .ctx-item-sub.active {
      color: var(--accent);
    }

    .ctx-item-sub .ctx-ico {
      color: var(--accent);
    }

    /* ── MODAL ── */
    #movl {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      backdrop-filter: blur(6px);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #movl.on {
      opacity: 1;
      pointer-events: all;
    }

    .mbox {
      background: var(--surface);
      border: 1px solid var(--border3);
      border-radius: 14px;
      width: 400px;
      max-width: 93vw;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: popIn .28s cubic-bezier(.34, 1.56, .64, 1);
    }

    .mhdr {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .mhdr h3 {
      font-size: 15px;
      font-weight: 600;
    }

    #mb {
      padding: 16px 20px;
      max-height: 60vh;
      overflow-y: auto;
    }

    #mb p {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.55;
    }

    #mbts {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    .mbtn {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: background .15s;
    }

    .mbtn.pri {
      background: var(--accent);
      color: #fff;
    }

    .mbtn.pri:hover {
      background: var(--accent-h);
    }

    .mbtn.sec {
      background: var(--surface3);
      color: var(--text2);
    }

    .mbtn.sec:hover {
      background: var(--surface4);
    }

    .mbtn.dng {
      background: var(--danger);
      color: #fff;
    }

    .mbtn.dng:hover {
      filter: brightness(1.1);
    }

    .minp {
      width: 100%;
      background: var(--surface3);
      border: 1.5px solid var(--border2);
      border-radius: var(--rsm);
      padding: 10px 13px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color .18s;
    }

    .minp:focus {
      border-color: var(--accent);
    }

    /* ── PROPERTIES ── */
    #props-ovl {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      backdrop-filter: blur(4px);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #props-ovl.on {
      opacity: 1;
      pointer-events: all;
    }

    .props-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      width: 380px;
      max-width: 93vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      animation: popIn .28s cubic-bezier(.34, 1.56, .64, 1);
    }

    .props-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .props-title {
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .props-close {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: none;
      background: var(--surface3);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .props-close svg {
      width: 14px;
      height: 14px;
    }

    .props-body {
      padding: 12px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .props-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12.5px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .props-row:last-child {
      border-bottom: none;
    }

    .props-key {
      color: var(--text3);
      font-weight: 500;
      flex-shrink: 0;
    }

    .props-val {
      color: var(--text);
      text-align: right;
    }

    /* ── PREVIEW OVERLAY ── */
    #pvovl {
      position: fixed;
      inset: 0;
      z-index: 8500;
      background: rgba(0, 0, 0, .92);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #pvovl.on {
      opacity: 1;
      pointer-events: all;
    }

    .pv-hdr {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      flex-shrink: 0;
    }

    .pv-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pv-close {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, .08);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .pv-close:hover {
      background: rgba(255, 255, 255, .15);
    }

    .pv-close svg {
      width: 16px;
      height: 16px;
    }

    #pvc {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .pv-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      cursor: zoom-in;
    }

    .pv-img-full {
      max-width: none;
      max-height: none;
      cursor: zoom-out;
    }

    .pv-video {
      max-width: 100%;
      max-height: 100%;
    }

    .pv-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .pv-text {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
      padding: 20px;
      line-height: 1.65;
      max-width: 900px;
      width: 100%;
    }

    .pv-audio-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px;
      max-width: 400px;
    }

    .pv-audio-icon svg {
      width: 120px;
      height: 120px;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .pv-audio-name {
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }

    .pv-unsupported,
    .pv-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text3);
      text-align: center;
      padding: 40px;
    }

    .pv-loading {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pv-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--surface3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .pv-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, .1);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      z-index: 1;
    }

    .pv-nav:hover {
      background: rgba(255, 255, 255, .2);
    }

    .pv-nav.dis {
      opacity: .3;
      pointer-events: none;
    }

    .pv-nav svg {
      width: 18px;
      height: 18px;
    }

    #pv-prev {
      left: 12px;
    }

    #pv-next {
      right: 12px;
    }

    .pv-info {
      padding: 8px 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text3);
      flex-shrink: 0;
    }

    /* ── HTML RUNNER ── */
    /* ══════════════════════════════════════════════
       WINDOW MANAGER — Full multi-window system
    ══════════════════════════════════════════════ */
    /* --taskbar-h is defined in :root above */
    :root {
      --win-titlebar-h: 38px;
      --win-radius: 12px;
    }

    /* Window Layer */
    #wm-layer {
      position: fixed;
      inset: 0;
      /* bottom: var(--taskbar-h); */
      pointer-events: none;
      z-index: 8500;
    }

    /* Individual Window */
    .sv-window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: var(--win-radius);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .07);
      overflow: hidden;
      pointer-events: all;
      transition: box-shadow .15s, opacity .15s, transform .2s;
      min-width: 280px;
      min-height: 200px;
      will-change: transform;
    }

    .sv-window.wm-focused {
      box-shadow: 0 32px 90px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 255, 255, .12);
    }

    .sv-window.wm-minimized {
      opacity: 0;
      pointer-events: none;
      transform: translateY(40px) scale(.9);
    }

    .sv-window.wm-maximized {
      border-radius: 0 !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      transition: none;
    }

    .sv-window.wm-animating {
      transition: top .22s cubic-bezier(.33, 1, .68, 1),
        left .22s cubic-bezier(.33, 1, .68, 1),
        width .22s cubic-bezier(.33, 1, .68, 1),
        height .22s cubic-bezier(.33, 1, .68, 1);
    }

    /* Window Title Bar */
    .wm-titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      height: var(--win-titlebar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      cursor: move;
      user-select: none;
      -webkit-user-select: none;
    }

    .wm-dots {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .wm-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      position: relative;
      transition: filter .12s, transform .1s;
      flex-shrink: 0;
    }

    .wm-dot:hover {
      filter: brightness(1.25);
      transform: scale(1.1);
    }

    .wm-dot:active {
      transform: scale(.92);
    }

    .wm-dot.close {
      background: #f05268;
    }

    .wm-dot.minimize {
      background: #f0a840;
    }

    .wm-dot.maximize {
      background: #3ecf8e;
    }

    /* Show symbols on hover of titlebar */
    .wm-titlebar:hover .wm-dot.close::after {
      content: '×';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: rgba(0, 0, 0, .6);
      line-height: 1;
    }

    .wm-titlebar:hover .wm-dot.minimize::after {
      content: '–';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: rgba(0, 0, 0, .6);
      line-height: 1;
    }

    .wm-titlebar:hover .wm-dot.maximize::after {
      content: '⤢';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: rgba(0, 0, 0, .6);
      line-height: 1;
    }

    .wm-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .wm-icon svg {
      width: 18px;
      height: 18px;
    }

    .wm-title {
      flex: 1;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wm-toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .wm-tbtn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, color .12s;
    }

    .wm-tbtn:hover {
      background: var(--surface2);
      color: var(--text);
    }

    .wm-tbtn svg {
      width: 13px;
      height: 13px;
    }

    /* Resize handles */
    .wm-resize {
      position: absolute;
      z-index: 10;
    }

    .wm-resize.se {
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: se-resize;
    }

    .wm-resize.sw {
      bottom: 0;
      left: 0;
      width: 16px;
      height: 16px;
      cursor: sw-resize;
    }

    .wm-resize.ne {
      top: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: ne-resize;
    }

    .wm-resize.e {
      right: 0;
      top: 16px;
      bottom: 16px;
      width: 6px;
      cursor: e-resize;
    }

    .wm-resize.s {
      bottom: 0;
      left: 16px;
      right: 16px;
      height: 6px;
      cursor: s-resize;
    }

    .wm-resize.n {
      top: 0;
      left: 16px;
      right: 16px;
      height: 6px;
      cursor: n-resize;
    }

    .wm-resize.w {
      left: 0;
      top: 16px;
      bottom: 16px;
      width: 6px;
      cursor: w-resize;
    }

    /* Window body */
    .wm-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    /* iFrame inside window */
    .wm-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    /* Media viewer */
    .wm-media {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .wm-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .wm-media video,
    .wm-media audio {
      max-width: 100%;
      max-height: 100%;
    }

    .wm-media audio {
      width: 80%;
    }

    /* Image stage: pinch-zoom / pan surface */
    .wm-img-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      /* we handle pan/zoom gestures ourselves */
      cursor: grab;
    }

    .wm-img-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      /* stage handles the gestures, not the img itself */
    }

    /* Prev / Next image nav buttons — both sides, always reachable */
    .wm-img-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(20, 21, 30, .55);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background .15s, opacity .15s;
      opacity: .55;
      z-index: 5;
    }

    .wm-img-nav:hover {
      background: rgba(79, 142, 247, .55);
      opacity: 1;
    }

    .wm-img-nav svg {
      width: 20px;
      height: 20px;
    }

    .wm-img-nav-l {
      left: 10px;
    }

    .wm-img-nav-r {
      right: 10px;
    }

    @media (max-width: 640px) {
      .wm-img-nav {
        opacity: .8;
        width: 44px;
        height: 44px;
      }
    }

    /* Text / code viewer */
    .wm-text {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      box-sizing: border-box;
    }

    /* Properties panel */
    .wm-props {
      padding: 20px;
      overflow-y: auto;
      height: 100%;
      box-sizing: border-box;
    }

    .wm-prop-row {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .wm-prop-label {
      width: 110px;
      color: var(--text3);
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .wm-prop-val {
      color: var(--text);
      word-break: break-all;
    }

    .wm-prop-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wm-prop-icon svg {
      width: 72px;
      height: 72px;
    }

    /* HTML App nav bar */
    .wm-appnav {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .wm-appnav-btn {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wm-appnav-btn:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .wm-appnav-btn:disabled {
      opacity: .3;
      pointer-events: none;
    }

    .wm-appnav-btn svg {
      width: 12px;
      height: 12px;
    }

    .wm-appnav-addr {
      flex: 1;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--surface3);
      border-radius: 4px;
      padding: 3px 8px;
    }

    .wm-appnav-reload {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wm-appnav-reload:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .wm-appnav-reload svg {
      width: 12px;
      height: 12px;
    }

    .wm-appnav-zoom-label {
      font-size: 10.5px;
      font-family: var(--mono);
      color: var(--text3);
      min-width: 34px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════
       TASKBAR / DOCK — macOS Dock-style
    ══════════════════════════════════════════════ */
    #taskbar-wrapper {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    /* ── DOCK (the floating bar) ── */
    #taskbar {
      pointer-events: all;
      height: calc(var(--taskbar-h) - 16px);
      background: rgba(22, 23, 36, .82);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, .7), 0 2px 0 rgba(255, 255, 255, .06) inset;
      max-width: calc(100vw - 40px);
      overflow-x: auto;
      overflow-y: visible;
      transition: opacity .08s linear;
    }

    #taskbar::-webkit-scrollbar {
      display: none;
    }

    /* Hidden state (for toggle mode) */
    #taskbar.tb-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ── DOCK TOGGLE BUTTON (mobile/compact mode) ── */
    #tb-toggle-btn {
      pointer-events: all;
      position: fixed;
      bottom: 20px;
      right: 20px;
      left: auto;
      transform: none;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(22, 23, 36, .88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9001;
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), background .15s;
    }

    #tb-toggle-btn:hover {
      background: rgba(79, 142, 247, .3);
    }

    #tb-toggle-btn svg {
      width: 22px;
      height: 22px;
      color: #fff;
    }

    /* Compact mode: dock hidden, toggle shown */
    body.tb-compact #taskbar-wrapper {
      left: auto;
      right: 20px;
      transform: none;
      bottom: 20px;
      align-items: flex-end;
    }

    /* body.tb-compact #taskbar {
      dock appears above the toggle btn
    } */

    body.tb-compact #tb-toggle-btn {
      display: flex;
    }

    /* Mobile: always compact */
    @media (max-width: 640px) {
      #taskbar-wrapper {
        left: auto !important;
        right: 14px !important;
        bottom: 14px !important;
        transform: none !important;
        align-items: flex-end !important;
      }

      #taskbar {
        max-width: calc(100vw - 28px);
        /* hidden by default on mobile, shown via toggle */
      }


      #tb-toggle-btn {
        display: flex !important;
      }

      #app {
        height: 100vh !important;
        /* full height, no taskbar reservation */
        padding-bottom: 0;
      }
    }

    .tb-sep {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, .12);
      flex-shrink: 0;
      margin: 0 2px;
    }

    .tb-app {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .tb-app-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), filter .15s;
      position: relative;
      overflow: hidden;
      z-index: 99999;
    }

    .tb-app:hover .tb-app-icon {
      transform: scale(1.22) translateY(-4px);
      filter: brightness(1.1);
    }

    .tb-app.active .tb-app-icon {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .tb-app-icon svg {
      width: 26px;
      height: 26px;
    }

    .tb-app-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: opacity .2s;
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
    }

    .tb-app.running .tb-app-dot {
      opacity: 1;
    }

    .tb-app-label {
      font-size: 9px;
      color: rgba(255, 255, 255, .5);
      max-width: 52px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: none;
    }

    /* Tooltip on hover */
    .tb-app::before {
      content: attr(data-label);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 36, .92);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      margin-bottom: 8px;
      transition: opacity .15s;
      border: 1px solid rgba(255, 255, 255, .1);
    }

    .tb-app:hover::before {
      opacity: 1;
    }

    /* Fixed dock apps (always visible) */
    .tb-app.pinned .tb-app-icon {
      background: var(--surface3);
    }

    /* Running app icons */
    .tb-app.running:not(.pinned) .tb-app-icon {
      background: var(--accent-dim);
    }

    /* Minimized indicator */
    .tb-app.minimized .tb-app-icon {
      opacity: .6;
    }

    /* Close (×) button on a running taskbar app — shown on hover
       (desktop) or after a long-press (touch, via .show-actions) */
    .tb-app-close {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, .25);
      background: var(--danger);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(.7);
      pointer-events: none;
      transition: opacity .12s, transform .12s;
      z-index: 5;
      cursor: pointer;
    }

    .tb-app-close svg {
      width: 10px;
      height: 10px;
    }

    .tb-app.running:hover .tb-app-close,
    .tb-app.running.show-actions .tb-app-close {
      opacity: 1;
      transform: scale(1);
      pointer-events: all;
    }

    /* Badge on the mobile dock-toggle button showing running app count */
    .tb-toggle-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 16px;
      height: 16px;
      padding: 0 3px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--bg);
    }

    .tb-toggle-badge.on {
      display: flex;
    }

    /* ── PROGRESS ── */
    #prog-ovl {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      backdrop-filter: blur(5px);
      z-index: 9500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #prog-ovl.on {
      opacity: 1;
      pointer-events: all;
    }

    .prog-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 24px 28px;
      width: 320px;
      box-shadow: var(--shadow);
    }

    #prog-msg {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 14px;
      color: var(--text2);
    }

    .prog-bar {
      height: 5px;
      background: var(--surface3);
      border-radius: 3px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width .3s;
      width: 0;
    }

    /* ── TOASTS ── */
    #toasts {
      position: fixed;
      bottom: 28px;
      right: 18px;
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      max-width: 300px;
      opacity: 0;
      transform: translateX(16px);
      transition: opacity .25s, transform .25s;
      pointer-events: auto;
    }

    .toast.on {
      opacity: 1;
      transform: none;
    }

    .toast.s {
      border-left: 3px solid var(--success);
    }

    .toast.e {
      border-left: 3px solid var(--danger);
    }

    .toast.w {
      border-left: 3px solid var(--warn);
    }

    .toast.i {
      border-left: 3px solid var(--accent);
    }

    /* ── MOBILE OVERLAY ── */
    #sb-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 7999;
    }

    #sb-overlay.on {
      display: block;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      :root {
        --sidebar-w: 0px;
        --taskbar-h: 64px;
      }

      #sidebar {
        display: none;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 240px;
        z-index: 8000;
        box-shadow: 6px 0 24px rgba(0, 0, 0, .5);
        grid-row: unset;
      }

      #sidebar.mob-open {
        display: flex;
      }

      #sb-toggle {
        display: flex;
      }

      #app {
        grid-template-columns: 1fr;
        grid-template-rows: var(--toolbar-h) var(--cmdbar-h) 1fr var(--status-h);
        height: 100vh;
        padding-bottom: 0;
      }

      #fc {
        /* Ensure full height - critical for mobile visibility */
        grid-column: 1;
        min-height: 0;
        height: 100%;
        -webkit-overflow-scrolling: touch;
      }

      .fl-hdr,
      .fl-row {
        grid-template-columns: 1fr 70px 80px;
      }

      .ldt {
        display: none;
      }

      .cb-btn span {
        display: none;
      }

      .tb-search {
        display: none;
      }

      /* Gallery smaller on mobile */
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }

      /* File grid smaller */
      .fg {
        grid-template-columns: repeat(auto-fill, minmax(88px, 88px));
        gap: 3px;
      }

      .fi {
        width: 88px;
        padding: 8px 5px;
      }

      /* Bigger touch targets */
      .fi-ic {
        width: 52px;
        height: 52px;
      }

      /* Mobile taskbar handled by tb-compact system */
    }

    @media (max-width: 420px) {
      .abox {
        padding: 28px 20px;
      }

      .fg {
        grid-template-columns: repeat(auto-fill, 84px);
      }

      .fi {
        width: 84px;
      }
    }

    /* ── VIRTUAL SCROLLER ── */
    .vscroll-container {
      position: relative;
      width: 100%;
      contain: strict;
    }

    .vscroll-spacer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      pointer-events: none;
    }

    .vscroll-items {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      will-change: transform;
    }

    .vscroll-sentinel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
    }

    /* ── ENHANCED GALLERY ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 6px;
      padding: 2px;
    }

    .gal-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface2);
      border: 1.5px solid transparent;
      transition: border-color .15s, transform .15s;
    }

    .gal-item:hover {
      border-color: var(--border3);
      transform: scale(1.02);
    }

    .gal-item.sel {
      border-color: var(--accent);
    }

    .gal-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gal-item .gal-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, .7));
      opacity: 0;
      transition: opacity .2s;
    }

    .gal-item:hover .gal-overlay {
      opacity: 1;
    }

    .gal-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 8px 6px;
      font-size: 11px;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transform: translateY(4px);
      transition: transform .2s;
    }

    .gal-item:hover .gal-name {
      transform: none;
    }

    .gal-non-image {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 100%;
      padding: 12px;
    }

    .gal-non-image svg {
      width: 44px;
      height: 44px;
    }

    .gal-non-image span {
      font-size: 11px;
      color: var(--text3);
      text-align: center;
      word-break: break-all;
      overflow: hidden;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ── BULK RENAME ── */
    .brn-preview {
      background: var(--surface3);
      border-radius: var(--rsm);
      padding: 10px 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      font-family: var(--mono);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brn-old {
      color: var(--text3);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brn-arrow {
      color: var(--accent);
      flex-shrink: 0;
    }

    .brn-new {
      color: var(--success);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brn-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brn-field label {
      display: block;
      font-size: 11px;
      color: var(--text3);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .brn-field input,
    .brn-field select {
      width: 100%;
      background: var(--surface3);
      border: 1.5px solid var(--border2);
      border-radius: var(--rsm);
      padding: 7px 10px;
      color: var(--text);
      font-size: 12.5px;
      font-family: var(--font);
      outline: none;
      transition: border-color .18s;
    }

    .brn-field input:focus,
    .brn-field select:focus {
      border-color: var(--accent);
    }

    /* ── THEME VARIANTS ── */
    .theme-light {
      --bg: #f0f1f5;
      --surface: #ffffff;
      --surface2: #f4f5f9;
      --surface3: #e8eaf0;
      --surface4: #dde0ea;
      --border: rgba(0, 0, 0, .07);
      --border2: rgba(0, 0, 0, .12);
      --border3: rgba(0, 0, 0, .20);
      --text: #1a1d2e;
      --text2: #5a5f7a;
      --text3: #9097b2;
    }

    /* ── LOADING SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .fi-skeleton {
      width: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 6px;
    }

    .fi-sk-ico {
      width: 56px;
      height: 56px;
      border-radius: 8px;
    }

    .fi-sk-nm {
      width: 72px;
      height: 10px;
      border-radius: 4px;
    }

    /* ── IMPROVED MODAL FIELDS ── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .field-group label {
      font-size: 11.5px;
      color: var(--text2);
      font-weight: 500;
    }

    .field-group select {
      width: 100%;
      background: var(--surface3);
      border: 1.5px solid var(--border2);
      border-radius: var(--rsm);
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color .18s;
    }

    .field-group select:focus {
      border-color: var(--accent);
    }

    .field-row {
      display: flex;
      gap: 10px;
    }

    .field-row .field-group {
      flex: 1;
    }

    .field-check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }

    .field-check input[type=checkbox] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
    }

    .field-check label {
      font-size: 12.5px;
      color: var(--text2);
    }

    /* ── WELCOME SCREEN ── */
    #welcome-tips {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }

    .tip-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: var(--rsm);
    }

    .tip-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent-dim);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tip-icon svg {
      width: 16px;
      height: 16px;
    }

    .tip-text h4 {
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .tip-text p {
      font-size: 11.5px;
      color: var(--text3);
      line-height: 1.4;
    }

    /* ── TAGS ── */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: var(--accent-dim);
      color: var(--accent);
      cursor: default;
    }

    .tag-pill-remove {
      cursor: pointer;
      opacity: .6;
      transition: opacity .1s;
    }

    .tag-pill-remove:hover {
      opacity: 1;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      gap: 2px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 4px 8px 0;
      overflow-x: auto;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px 6px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      color: var(--text3);
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .13s, color .13s;
    }

    .tab-item:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .tab-item.active {
      background: var(--bg);
      color: var(--text);
      border-color: var(--border);
      position: relative;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--bg);
    }

    .tab-close {
      opacity: .5;
      cursor: pointer;
    }

    .tab-close:hover {
      opacity: 1;
    }

    .tab-add {
      padding: 6px 10px;
      border-radius: 6px;
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .tab-add:hover {
      color: var(--text);
      background: var(--surface3);
    }

    /* ── CONTEXT MENU SUBMENU ── */
    .ctx-sub {
      position: relative;
    }

    .ctx-sub .ctx-submenu {
      display: none;
      position: absolute;
      left: 100%;
      top: -5px;
      background: var(--surface2);
      border: 1px solid var(--border3);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .65);
      padding: 5px;
      min-width: 160px;
      z-index: 8001;
    }

    .ctx-sub:hover .ctx-submenu {
      display: block;
    }

    /* ── FILE ICON COLORS ── */
    .icon-img {
      color: #f472b6;
    }

    .icon-video {
      color: #a78bfa;
    }

    .icon-audio {
      color: #34d399;
    }

    .icon-doc {
      color: #60a5fa;
    }

    .icon-pdf {
      color: #f87171;
    }

    .icon-code {
      color: #facc15;
    }

    .icon-zip {
      color: #fb923c;
    }

    .icon-folder {
      color: #fbbf24;
    }

    .icon-folder-open {
      color: #f59e0b;
    }

    /* ── ENHANCED AUTOLOCK ── */
    .autolock-urgent {
      background: var(--warn) !important;
    }

    .autolock-critical {
      background: var(--danger) !important;
    }

    /* ── UPLOAD QUEUE ── */
    #upload-queue {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: var(--shadow);
      z-index: 9000;
      min-width: 280px;
      max-width: 400px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    #upload-queue.on {
      display: flex;
    }

    .uq-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
    }

    .uq-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .uq-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text2);
    }

    .uq-prog {
      width: 60px;
      height: 4px;
      background: var(--surface3);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .uq-prog-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .3s;
    }

    .uq-status {
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
    }

    /* ── WINDOW SNAP INDICATOR ── */
    .snap-indicator {
      position: fixed;
      background: rgba(79, 142, 247, .15);
      border: 2px solid var(--accent);
      border-radius: 8px;
      pointer-events: none;
      z-index: 8999;
      transition: all .1s;
      display: none;
    }

    /* ── IMPROVED HIDDEN VAULT ── */
    #hvault-ovl {
      position: fixed;
      inset: 0;
      z-index: 9100;
      background: radial-gradient(ellipse at 60% 50%, #1a0e35 0%, #0a0710 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    #hvault-ovl.on {
      opacity: 1;
      pointer-events: all;
    }

    .hvault-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #hvault-bar {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, .04);
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      gap: 10px;
    }

    #hvault-bar .hv-label {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: #d0b4ff;
      letter-spacing: .02em;
    }

    /* ── MOBILE BOTTOM SHEET ── */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border2);
      border-bottom: none;
      z-index: 9500;
      padding: 12px 0 env(safe-area-inset-bottom, 16px);
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32, 0, .67, 0);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, .5);
      max-height: 85vh;
      overflow-y: auto;
    }

    .bottom-sheet.on {
      transform: none;
      transition: transform .35s cubic-bezier(.33, 1, .68, 1);
    }

    .bs-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--surface3);
      margin: 0 auto 12px;
    }

    .bs-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      color: var(--text2);
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font);
      transition: background .1s;
    }

    .bs-item:active {
      background: var(--surface2);
    }

    .bs-item svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--text3);
    }

    .bs-item.danger {
      color: var(--danger);
    }

    .bs-item.danger svg {
      color: var(--danger);
    }

    .bs-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    #bs-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      z-index: 9400;
    }

    #bs-overlay.on {
      display: block;
    }

    /* ── IMPROVED FILE CARD ── */
    .fi {
      position: relative;
      transition: background var(--tr), border-color var(--tr), transform .1s;
    }

    .fi:active {
      transform: scale(.96);
    }

    .fi .fi-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 700;
      background: var(--accent-dim);
      color: var(--accent);
      letter-spacing: .03em;
    }

    /* ── SCROLL BUTTON ── */
    #scroll-top-btn {
      position: fixed;
      bottom: 36px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text2);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 800;
      box-shadow: var(--shadow-sm);
      transition: background .15s, opacity .2s;
    }

    #scroll-top-btn.on {
      display: flex;
    }

    #scroll-top-btn:hover {
      background: var(--surface4);
      color: var(--text);
    }

    #scroll-top-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ══════════════════════════════════════════════
       ENHANCEMENT PASS — touch, scrolling, WM, dock,
       loading states, drag/drop, hidden-vault polish
    ══════════════════════════════════════════════ */

    /* ── Smooth momentum scrolling & overflow containment everywhere ── */
    #fc,
    #sidebar,
    #taskbar,
    #toolbar,
    .wm-body,
    .modal-body,
    .pv-body,
    .fl,
    .gallery-grid,
    .ctx-menu,
    .props-body,
    .tag-editor-body,
    #wm-layer .wm-frame-wrap,
    .cmd-scroll {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    #toolbar {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    #toolbar::-webkit-scrollbar {
      display: none;
    }

    /* ── Touch multi-select mode: clear checkbox-style affordance (no hover needed) ── */
    body.touch-select-mode .fi,
    body.touch-select-mode .fl-row,
    body.touch-select-mode .gal-item {
      position: relative;
    }

    body.touch-select-mode .fi::before,
    body.touch-select-mode .fl-row::before,
    body.touch-select-mode .gal-item::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .4);
      background: rgba(0, 0, 0, .25);
      z-index: 3;
    }

    body.touch-select-mode .fi.sel::before,
    body.touch-select-mode .fl-row.sel::before,
    body.touch-select-mode .gal-item.sel::before {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(79, 142, 247, .35);
    }

    body.touch-select-mode .fi.sel::after,
    body.touch-select-mode .gal-item.sel::after {
      content: '✓';
      position: absolute;
      top: 6px;
      left: 6px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      z-index: 4;
      pointer-events: none;
    }

    #fc,
    #sidebar,
    .fl {
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Thin, unobtrusive scrollbars on desktop, invisible-until-hover */
    #fc::-webkit-scrollbar,
    #sidebar::-webkit-scrollbar,
    .fl::-webkit-scrollbar,
    .wm-body::-webkit-scrollbar,
    .modal-body::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    #fc::-webkit-scrollbar-thumb,
    #sidebar::-webkit-scrollbar-thumb,
    .fl::-webkit-scrollbar-thumb,
    .wm-body::-webkit-scrollbar-thumb,
    .modal-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .14);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    #fc::-webkit-scrollbar-thumb:hover,
    .fl::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, .24);
      background-clip: padding-box;
    }

    /* Prevent rubber-banding on iOS from leaking into body */
    html,
    body {
      overscroll-behavior: none;
    }

    /* ── Touch-friendly hit targets on coarse pointers ── */
    @media (pointer: coarse) {
      .wm-dot {
        width: 16px;
        height: 16px;
      }

      .wm-dots {
        gap: 9px;
      }

      .wm-titlebar {
        height: 44px;
      }

      .wm-resize.n,
      .wm-resize.s {
        height: 14px;
      }

      .wm-resize.e,
      .wm-resize.w {
        width: 14px;
      }

      .wm-resize.se,
      .wm-resize.sw,
      .wm-resize.ne,
      .wm-resize.nw {
        width: 26px;
        height: 26px;
      }

      .tb-app-icon {
        width: 48px;
        height: 48px;
      }

      .cb-btn,
      .wm-tbtn {
        min-height: 34px;
      }
    }

    /* ── Traffic-light glyphs: always visible (not hover-gated) so touch users see them too ── */
    .wm-dot.close::after,
    .wm-dot.minimize::after,
    .wm-dot.maximize::after {
      content: '';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      color: rgba(0, 0, 0, 0);
      transition: color .12s;
    }

    .wm-dot.close::after {
      content: '×';
      font-size: 11px;
    }

    .wm-dot.minimize::after {
      content: '–';
    }

    .wm-dot.maximize::after {
      content: '⤢';
      font-size: 8px;
    }

    .wm-titlebar:hover .wm-dot::after,
    .wm-titlebar:active .wm-dot::after,
    .sv-window.wm-focused .wm-dot::after {
      color: rgba(0, 0, 0, .62);
    }

    @media (pointer: coarse) {

      /* Always show glyphs on touch devices — there is no hover state */
      .wm-dot::after {
        color: rgba(0, 0, 0, .55) !important;
      }
    }

    .wm-resize.nw {
      top: 0;
      left: 0;
      width: 16px;
      height: 16px;
      cursor: nw-resize;
    }

    .wm-titlebar,
    .wm-resize {
      touch-action: none;
    }

    /* ── Window snap preview overlay ── */
    #wm-snap-preview {
      position: fixed;
      background: rgba(79, 142, 247, .22);
      border: 2px solid rgba(79, 142, 247, .8);
      border-radius: 10px;
      z-index: 8600;
      pointer-events: none;
      opacity: 0;
      transform: scale(.98);
      transition: opacity .12s ease, transform .12s ease, top .12s ease, left .12s ease, width .12s ease, height .12s ease;
    }

    #wm-snap-preview.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Window open/close/focus motion polish ── */
    .sv-window.wm-opening {
      animation: wmPopIn .22s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes wmPopIn {
      from {
        opacity: 0;
        transform: scale(.94) translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .sv-window.wm-closing {
      animation: wmPopOut .16s cubic-bezier(.4, 0, 1, 1) forwards;
    }

    @keyframes wmPopOut {
      from {
        opacity: 1;
        transform: none;
      }

      to {
        opacity: 0;
        transform: scale(.92) translateY(8px);
      }
    }

    .sv-window.wm-dragging,
    .sv-window.wm-resizing {
      transition: none !important;
      user-select: none;
    }

    .sv-window.wm-dragging .wm-frame,
    .sv-window.wm-resizing .wm-frame {
      pointer-events: none;
      /* keep iframe from swallowing move events mid-drag */
    }

    /* ── Loading overlay shown while a window's content is loading ── */
    .wm-loading-ovl {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg);
      z-index: 5;
      opacity: 1;
      transition: opacity .2s ease;
    }

    .wm-loading-ovl.hide {
      opacity: 0;
      pointer-events: none;
    }

    .wm-spinner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .12);
      border-top-color: var(--accent);
      animation: wmSpin .7s linear infinite;
    }

    @keyframes wmSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .wm-loading-label {
      font-size: 11.5px;
      color: var(--text3);
      letter-spacing: .02em;
    }

    /* Generic inline spinner (small, for buttons/toasts/app-open feedback) */
    .sv-spin {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .18);
      border-top-color: currentColor;
      animation: wmSpin .6s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Thumbnail shimmer while a file's preview image is generating */
    img[data-thumb-id]:not([src]) {
      background: linear-gradient(100deg, rgba(255, 255, 255, .03) 30%, rgba(255, 255, 255, .09) 50%, rgba(255, 255, 255, .03) 70%);
      background-size: 200% 100%;
      animation: thumbShimmer 1.3s ease-in-out infinite;
    }

    @keyframes thumbShimmer {
      0% {
        background-position: 140% 0;
      }

      100% {
        background-position: -40% 0;
      }
    }

    /* Dock apps: bounce-in on open, more stable spacing so many windows don't jitter */
    .tb-app.tb-just-opened .tb-app-icon {
      animation: dockBounce .42s cubic-bezier(.34, 1.7, .5, 1);
    }

    @keyframes dockBounce {
      0% {
        transform: translateY(0) scale(.4);
        opacity: 0;
      }

      55% {
        transform: translateY(-10px) scale(1.12);
        opacity: 1;
      }

      100% {
        transform: translateY(0) scale(1);
      }
    }

    #tb-running {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tb-app {
      transition: margin .12s ease;
    }

    /* ── Drag & drop of items onto folders / hidden vault ── */
    .fi.dnd-source-dragging,
    .fl-row.dnd-source-dragging,
    .gal-item.dnd-source-dragging {
      opacity: .4;
    }

    .fi.dnd-drop-target,
    .fl-row.dnd-drop-target,
    .sb-item.dnd-drop-target,
    .sb-tree-item.dnd-drop-target {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      background: var(--accent-sel);
      border-radius: var(--rsm);
    }

    #btn-hvault.dnd-drop-target {
      background: rgba(139, 92, 246, .35) !important;
      box-shadow: 0 0 0 2px #8b5cf6;
    }

    .dnd-ghost {
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(30, 31, 44, .95);
      border: 1px solid rgba(255, 255, 255, .15);
      color: var(--text);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
      transform: translate(-50%, -140%);
    }

    /* ── Sidebar Recent section header w/ Clear action ── */
    .sb-section-title.with-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sb-clear-btn {
      font-size: 10.5px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color .12s, background .12s;
    }

    .sb-clear-btn:hover {
      color: var(--danger);
      background: rgba(240, 83, 110, .1);
    }

    /* ── Hidden-vault "you are inside" banner + exit affordance ── */
    #hv-exit-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(139, 92, 246, .14);
      border-bottom: 1px solid rgba(139, 92, 246, .3);
      font-size: 12px;
      color: #c4b5fd;
      flex-shrink: 0;
    }

    #hv-exit-banner.on {
      display: flex;
    }

    #hv-exit-banner button {
      margin-left: auto;
      background: rgba(139, 92, 246, .25);
      border: 1px solid rgba(139, 92, 246, .5);
      color: #ede9fe;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: background .12s;
    }

    #hv-exit-banner button:hover {
      background: rgba(139, 92, 246, .4);
    }

    /* Mobile refinements for panels/windows so overflow never clips content */
    @media (max-width: 640px) {
      .sv-window {
        min-width: 240px;
        min-height: 180px;
        border-radius: 14px 14px 0 0;
      }

      .wm-titlebar {
        border-radius: 0;
      }

      #wm-layer {
        inset: 0;
      }

      .modal-body,
      .pv-body,
      .props-body {
        max-height: 70vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .vtoggle span {
        display: none;
      }

      .lock-btn span {
        display: none;
      }
    }
  </style>
</head>

        </button>

          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 12a8 8 0 018-8c2.4 0 4.5.98 6.07 2.54L20 8" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" />
            <path d="M20 4v4h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"

            <path d="M20 12a8 8 0 01-8 8 7.97 7.97 0 01-6.07-2.54L4 16" stroke="currentColor" stroke-width="1.8"

            <path d="M4 20v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"

          </svg>
