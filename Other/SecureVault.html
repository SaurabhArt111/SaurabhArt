      </div>

      <div class="tb-addr"><span id="addr-display"><span class="a-crumb">Vault</span></span></div>

      <div class="tb-search">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5" />

    // SecureVault Application
    // ════════════════════════════════════════════════════════════
    // CORE: Storage / IndexedDB
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - Storage Module
     * Handles all IndexedDB operations for the file system
     */

    const DB_NAME = 'SecureVaultDB';
    const DB_VER = 4;
    const S_FILES = 'files';
    const S_BLOBS = 'blobs';
    const S_META = 'meta';
    const ROOT = '__root__';

    // ── Safe storage wrapper ────────────────────────────────────────
    // localStorage can throw a SecurityError when this page is itself
    // embedded in a sandboxed iframe (missing allow-same-origin), or be
    // silently blocked by browser tracking-prevention. Never let either
    // case crash the app — fall back to an in-memory Map instead.
    const safeStorage = (() => {
      let mem = new Map();
      let ok = false;
      try {
        const t = '__sv_probe__';
        window.localStorage.setItem(t, '1');
        window.localStorage.removeItem(t);
        ok = true;
      } catch (e) { ok = false; }
      return {
        get(key) {
          if (ok) { try { return window.localStorage.getItem(key); } catch (e) { ok = false; } }
          return mem.has(key) ? mem.get(key) : null;
        },
        set(key, val) {
          if (ok) { try { window.localStorage.setItem(key, val); return; } catch (e) { ok = false; } }
          mem.set(key, val);
        },
        remove(key) {
          if (ok) { try { window.localStorage.removeItem(key); return; } catch (e) { ok = false; } }
          mem.delete(key);
        }
      };
    })();

    // ── Global error handling ────────────────────────────────────────
    // Surfaces uncaught errors/rejections as a toast instead of a silent
    // blank screen or console-only failure, without breaking the app.
    window.addEventListener('error', (e) => {
      console.error('[SV-App error]', e.error || e.message);
      try {
        if (typeof toast === 'function') toast('Something went wrong: ' + (e.message || 'unknown error'), 'e');
        else document.dispatchEvent(new CustomEvent('sv:toast', { detail: { msg: 'Something went wrong: ' + (e.message || 'unknown error'), type: 'e' } }));
      } catch (_) { /* never let the handler itself throw */ }
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[SV-App error]', e.reason);
      try {
        const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
        if (typeof toast === 'function') toast('Something went wrong: ' + msg, 'e');
        else document.dispatchEvent(new CustomEvent('sv:toast', { detail: { msg: 'Something went wrong: ' + msg, type: 'e' } }));
      } catch (_) { /* never let the handler itself throw */ }
    });

    let _db = null;

    async function initDB() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, DB_VER);
        r.onupgradeneeded = e => {
          const d = e.target.result;
          const tx = e.target.transaction;
          // Files store
          if (!d.objectStoreNames.contains(S_FILES)) {
            const s = d.createObjectStore(S_FILES, { keyPath: 'id' });
            s.createIndex('pid', 'parentId', { unique: false });
            s.createIndex('name', 'name', { unique: false });
            s.createIndex('tags', 'tags', { unique: false, multiEntry: true });
          } else {
            const s = tx.objectStore(S_FILES);
            if (!s.indexNames.contains('pid')) s.createIndex('pid', 'parentId', { unique: false });
            if (!s.indexNames.contains('name')) s.createIndex('name', 'name', { unique: false });
            if (!s.indexNames.contains('tags')) s.createIndex('tags', 'tags', { unique: false, multiEntry: true });
          }
          // Blobs store (encrypted file data)
          if (!d.objectStoreNames.contains(S_BLOBS)) {
            d.createObjectStore(S_BLOBS, { keyPath: 'id' });
          }
          // Meta store (app settings, keys, etc.)
          if (!d.objectStoreNames.contains(S_META)) {
            d.createObjectStore(S_META, { keyPath: 'key' });
          }
        };
        r.onsuccess = e => { _db = e.target.result; res(_db); };
        r.onerror = e => rej(e.target.error);
      });
    }

    function _tx(store, mode = 'readonly') {
      return _db.transaction(store, mode).objectStore(store);
    }

    function _p(req) {
      return new Promise((res, rej) => {
        req.onsuccess = e => res(e.target.result);
        req.onerror = e => rej(e.target.error);
      });
    }

    // ── Meta store ──────────────────────────────────────────────
    const getMeta = async k => {
      try { const r = await _p(_tx(S_META).get(k)); return r ? r.value : null; } catch { return null; }
    };

    const setMeta = async (k, v) =>
      _p(_db.transaction(S_META, 'readwrite').objectStore(S_META).put({ key: k, value: v }));

    const delMeta = async k =>
      _p(_db.transaction(S_META, 'readwrite').objectStore(S_META).delete(k));

    // ── File metadata store ──────────────────────────────────────
    const saveFile = async meta =>
      _p(_db.transaction(S_FILES, 'readwrite').objectStore(S_FILES).put(meta));

    const getFile = async id => {
      try { return await _p(_tx(S_FILES).get(id)); } catch { return null; }
    };

    const getKids = async pid => {
      try { return await _p(_tx(S_FILES).index('pid').getAll(pid)); } catch { return []; }
    };

    const delFile = async id =>
      _p(_db.transaction(S_FILES, 'readwrite').objectStore(S_FILES).delete(id));

    const allFiles = async () => {
      try { return await _p(_tx(S_FILES).getAll()); } catch { return []; }
    };

    const patchFile = async (id, updates) => {
      const entry = await getFile(id);
      if (!entry) throw new Error('File not found: ' + id);
      return saveFile({ ...entry, ...updates, updatedAt: Date.now() });
    };

    const searchFiles = async (query, includeHidden = false) => {
      try {
        const all = await allFiles();
        const q = query.toLowerCase();
        return all.filter(f =>
          f.name && f.name.toLowerCase().includes(q) &&
          (includeHidden || !f.hidden) &&
          f.parentId !== HIDDEN_VAULT_ROOT && f.id !== HIDDEN_VAULT_ROOT
        );
      } catch { return []; }
    };

    const getFilesByTag = async tag => {
      try { return await _p(_tx(S_FILES).index('tags').getAll(tag)); } catch { return []; }
    };

    // ── Blob store (encrypted data) ───────────────────────────────
    const saveBlob = async (id, data) =>
      _p(_db.transaction(S_BLOBS, 'readwrite').objectStore(S_BLOBS).put({ id, data }));

    const getBlob = async id => {
      try { const r = await _p(_tx(S_BLOBS).get(id)); return r ? r.data : null; } catch { return null; }
    };

    const delBlob = async id =>
      _p(_db.transaction(S_BLOBS, 'readwrite').objectStore(S_BLOBS).delete(id));

    // ── Utilities ─────────────────────────────────────────────────
    async function checkStorageQuota(neededBytes) {
      if (!navigator.storage?.estimate) return true;
      try {
        const { usage, quota } = await navigator.storage.estimate();
        const available = quota - usage;
        if (neededBytes > available) return { ok: false, reason: `Need ${fmtSz(neededBytes)}, available ${fmtSz(available)}` };
        if ((usage + neededBytes) / quota > 0.9) return { ok: true, warn: `Storage ${Math.round((usage + neededBytes) / quota * 100)}% full` };
        return { ok: true };
      } catch { return { ok: true }; }
    }

    async function getStorageStats() {
      if (!navigator.storage?.estimate) return null;
      try { return await navigator.storage.estimate(); } catch { return null; }
    }

    async function ensureRoot() {
      const existing = await getFile(ROOT);
      if (!existing) {
        await saveFile({ id: ROOT, name: 'Vault', type: 'folder', parentId: null, createdAt: Date.now(), updatedAt: Date.now() });
      }
    }

    async function getPath(folderId) {
      const path = [];
      let cur = folderId;
      let guard = 0;
      while (cur && cur !== ROOT && guard < 50) {
        const f = await getFile(cur);
        if (!f) break;
        path.unshift(f);
        cur = f.parentId;
        guard++;
      }
      return path;
    }

    async function lsDir(folderId, showHidden = false) {
      const kids = await getKids(folderId);
      return kids.filter(k => showHidden || !k.hidden);
    }

    function fmtSz(b) {
      if (!b) return '0 B';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }

    // ── Recent Files tracking ─────────────────────────────────────
    const RECENT_KEY = 'recentFiles';
    const MAX_RECENT = 20;

    async function addRecent(fileId) {
      // Never track hidden items or anything living inside the Hidden Vault —
      // Recent must never be a side-channel that reveals hidden content.
      const f = await getFile(fileId);
      if (f && (f.hidden || f.parentId === HIDDEN_VAULT_ROOT)) return;
      let recents = (await getMeta(RECENT_KEY)) || [];
      recents = recents.filter(id => id !== fileId);
      recents.unshift(fileId);
      if (recents.length > MAX_RECENT) recents = recents.slice(0, MAX_RECENT);
      await setMeta(RECENT_KEY, recents);
    }

    async function getRecentFiles(includeHidden = false) {
      const ids = (await getMeta(RECENT_KEY)) || [];
      const files = [];
      let dirty = false;
      for (const id of ids) {
        const f = await getFile(id);
        if (!f) { dirty = true; continue; } // file was deleted since — drop it
        if (!includeHidden && (f.hidden || f.parentId === HIDDEN_VAULT_ROOT)) continue;
        files.push(f);
      }
      if (dirty) {
        // Prune stale/deleted ids so the list doesn't silently grow with ghosts
        await setMeta(RECENT_KEY, files.map(f => f.id));
      }
      return files;
    }

    async function clearRecentFiles() {
      await setMeta(RECENT_KEY, []);
    }

    // ── Favorites ────────────────────────────────────────────────
    const FAVS_KEY = 'favorites';

    async function toggleFavorite(fileId) {
      let favs = (await getMeta(FAVS_KEY)) || [];
      if (favs.includes(fileId)) {
        favs = favs.filter(id => id !== fileId);
      } else {
        favs.unshift(fileId);
      }
      await setMeta(FAVS_KEY, favs);
      return favs.includes(fileId);
    }

    async function getFavorites() {
      const ids = (await getMeta(FAVS_KEY)) || [];
      const files = [];
      for (const id of ids) {
        const f = await getFile(id);
        if (f) files.push(f);
      }
      return files;
    }

    async function isFavorite(fileId) {
      const favs = (await getMeta(FAVS_KEY)) || [];
      return favs.includes(fileId);
    }

    // ════════════════════════════════════════════════════════════
    // CORE: Encryption / AES-GCM
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - Encryption Module
     * AES-GCM 256-bit encryption with PBKDF2 key derivation
     * All file data is encrypted before storage in IndexedDB
     */

    const PBKDF2_ITER = 310000;
    const SALT_LEN = 32;
    const IV_LEN = 12;
    const VERIFY_TOKEN = 'SV_VAULT_OK_2024';

    let _sessionKey = null; // In-memory only — never persisted

    // ── Hex utilities ─────────────────────────────────────────────
    const buf2hex = buf => Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
    const hex2buf = hex => {
      const arr = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) arr[i / 2] = parseInt(hex.substr(i, 2), 16);
      return arr.buffer;
    };

    // ── Key derivation ────────────────────────────────────────────
    async function deriveKey(password, salt) {
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(password),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: PBKDF2_ITER, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    // ── Vault setup (first time) ──────────────────────────────────
    async function setupVault(password) {
      const salt = crypto.getRandomValues(new Uint8Array(SALT_LEN));
      const key = await deriveKey(password, salt);
      const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
      const enc = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        new TextEncoder().encode(VERIFY_TOKEN)
      );
      _sessionKey = key;
      return {
        salt: buf2hex(salt.buffer),
        iv: buf2hex(iv.buffer),
        token: buf2hex(enc)
      };
    }

    // ── Vault unlock ──────────────────────────────────────────────
    async function unlockVault(password, saltHex, ivHex, tokenHex) {
      try {
        const salt = new Uint8Array(hex2buf(saltHex));
        const iv = new Uint8Array(hex2buf(ivHex));
        const token = hex2buf(tokenHex);
        const key = await deriveKey(password, salt);
        const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, token);
        const text = new TextDecoder().decode(dec);
        if (text !== VERIFY_TOKEN) return false;
        _sessionKey = key;
        return true;
      } catch {
        return false;
      }
    }

    function lockVault() {
      _sessionKey = null;
    }

    function isUnlocked() {
      return _sessionKey !== null;
    }

    // ── Encrypt data ──────────────────────────────────────────────
    async function encrypt(data) {
      if (!_sessionKey) throw new Error('Vault is locked');
      const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
      const input = data instanceof ArrayBuffer ? data : data.buffer || new Uint8Array(data).buffer;
      const enc = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, _sessionKey, input);
      // Prepend IV to ciphertext: [IV (12 bytes)][ciphertext]
      const result = new Uint8Array(IV_LEN + enc.byteLength);
      result.set(iv, 0);
      result.set(new Uint8Array(enc), IV_LEN);
      return result.buffer;
    }

    // ── Decrypt data ──────────────────────────────────────────────
    async function decrypt(encData) {
      if (!_sessionKey) throw new Error('Vault is locked');
      const buf = encData instanceof ArrayBuffer ? encData : new Uint8Array(encData).buffer;
      const iv = new Uint8Array(buf, 0, IV_LEN);
      const ciphertext = new Uint8Array(buf, IV_LEN);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, _sessionKey, ciphertext);
    }

    // ── Hidden vault secondary encryption ────────────────────────
    // Hidden vault uses a separate key derived from a different password
    let _hiddenKey = null;

    async function setupHiddenVault(password) {
      const salt = crypto.getRandomValues(new Uint8Array(SALT_LEN));
      const key = await deriveKey(password, salt);
      const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
      const enc = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        new TextEncoder().encode('SV_HIDDEN_OK')
      );
      _hiddenKey = key;
      return {
        salt: buf2hex(salt.buffer),
        iv: buf2hex(iv.buffer),
        token: buf2hex(enc)
      };
    }

    async function unlockHiddenVault(password, saltHex, ivHex, tokenHex) {
      try {
        const salt = new Uint8Array(hex2buf(saltHex));
        const iv = new Uint8Array(hex2buf(ivHex));
        const token = hex2buf(tokenHex);
        const key = await deriveKey(password, salt);
        const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, token);
        if (new TextDecoder().decode(dec) !== 'SV_HIDDEN_OK') return false;
        _hiddenKey = key;
        return true;
      } catch { return false; }
    }

    function lockHiddenVault() {
      _hiddenKey = null;
    }

    function isHiddenUnlocked() {
      return _hiddenKey !== null;
    }

    async function encryptHidden(data) {
      if (!_hiddenKey) throw new Error('Hidden vault is locked');
      const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
      const input = data instanceof ArrayBuffer ? data : new Uint8Array(data).buffer;
      const enc = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, _hiddenKey, input);
      const result = new Uint8Array(IV_LEN + enc.byteLength);
      result.set(iv, 0);
      result.set(new Uint8Array(enc), IV_LEN);
      return result.buffer;
    }

    async function decryptHidden(encData) {
      if (!_hiddenKey) throw new Error('Hidden vault is locked');
      const buf = encData instanceof ArrayBuffer ? encData : new Uint8Array(encData).buffer;
      const iv = new Uint8Array(buf, 0, IV_LEN);
      const ciphertext = new Uint8Array(buf, IV_LEN);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, _hiddenKey, ciphertext);
    }

    // ── Folder-level password encryption ─────────────────────────
    // Each protected folder can have its own encryption context
    const _folderKeys = new Map();

    async function unlockFolder(folderId, password, saltHex, ivHex, tokenHex) {
      try {
        const salt = new Uint8Array(hex2buf(saltHex));
        const iv = new Uint8Array(hex2buf(ivHex));
        const token = hex2buf(tokenHex);
        const key = await deriveKey(password, salt);
        const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, token);
        if (new TextDecoder().decode(dec) !== 'SV_FOLDER_OK') return false;
        _folderKeys.set(folderId, key);
        return true;
      } catch { return false; }
    }

    async function setupFolderPassword(folderId, password) {
      const salt = crypto.getRandomValues(new Uint8Array(SALT_LEN));
      const key = await deriveKey(password, salt);
      const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
      const enc = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        new TextEncoder().encode('SV_FOLDER_OK')
      );
      _folderKeys.set(folderId, key);
      return {
        salt: buf2hex(salt.buffer),
        iv: buf2hex(iv.buffer),
        token: buf2hex(enc)
      };
    }

    function isFolderUnlocked(folderId) {
      return _folderKeys.has(folderId);
    }

    function lockFolder(folderId) {
      _folderKeys.delete(folderId);
    }

    // ── Password strength checker ─────────────────────────────────
    function checkPasswordStrength(pw) {
      let score = 0;
      if (!pw) return { score: 0, label: 'None', color: '#444' };
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[a-z]/.test(pw)) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;
      if (score <= 2) return { score, label: 'Weak', color: '#e05260' };
      if (score <= 4) return { score, label: 'Moderate', color: '#f0a030' };
      return { score, label: 'Strong', color: '#3ec87a' };
    }

    // ════════════════════════════════════════════════════════════
    // CORE: ZIP / JSZip
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - ZIP Module
     * Windows-compatible ZIP creation and extraction using JSZip
     * Fixed: proper DEFLATE compression, binary-safe export
     */

    // JSZip is loaded from CDN in index.html
    function getJSZip() {
      if (typeof JSZip === 'undefined') throw new Error('JSZip not loaded');
      return JSZip;
    }

    /**
     * Build a ZIP archive from an array of { name, data } entries.
     * @param {Array<{name: string, data: ArrayBuffer}>} entries
     * @returns {Promise<ArrayBuffer>} ZIP file bytes
     */
    async function buildZip(entries) {
      const Zip = getJSZip();
      const zip = new Zip();

      for (const { name, data } of entries) {
        if (!data || !name) continue;
        // Ensure we have a proper Uint8Array for binary-safe handling
        const bytes = data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(data.buffer || data);
        zip.file(name, bytes, {
          binary: true,
          compression: 'DEFLATE',
          compressionOptions: { level: 6 }
        });
      }

      // Generate using arraybuffer for binary correctness
      const result = await zip.generateAsync({
        type: 'arraybuffer',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 },
        // Windows-compatible: set platform to DOS (0), msDos: true
        platform: 'DOS'
      });

      return result;
    }

    /**
     * Extract a ZIP archive.
     * @param {ArrayBuffer} zipData
     * @returns {Promise<Array<{name: string, data: ArrayBuffer, isDir: boolean}>>}
     */
    async function extractZip(zipData) {
      const Zip = getJSZip();
      const zip = await Zip.loadAsync(zipData);
      const entries = [];

      for (const [name, file] of Object.entries(zip.files)) {
        if (file.dir) {
          entries.push({ name, data: null, isDir: true });
        } else {
          const data = await file.async('arraybuffer');
          entries.push({ name, data, isDir: false });
        }
      }

      return entries;
    }

    /**
     * Check if data looks like a ZIP file (magic bytes: PK\x03\x04)
     * @param {ArrayBuffer} data
     * @returns {boolean}
     */
    function isZipData(data) {
      if (!data || data.byteLength < 4) return false;
      const view = new Uint8Array(data);
      return view[0] === 0x50 && view[1] === 0x4B && view[2] === 0x03 && view[3] === 0x04;
    }

    /**
     * Trigger browser file download
     * @param {ArrayBuffer} buf
     * @param {string} filename
     * @param {string} mimeType
     */
    function triggerDownload(buf, filename, mimeType = 'application/octet-stream') {
      const blob = new Blob([buf], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    // ════════════════════════════════════════════════════════════
    // FEATURE: Drag-Select
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - Selection Module
     * Fixed drag-to-select with proper collision detection
     * Supports: mouse drag, Ctrl+click, Shift+click, Ctrl+A
     */

    class SelectionManager {
      constructor({ onSelectionChange } = {}) {
        this._selected = new Set();
        this._onSelectionChange = onSelectionChange || (() => { });
        this._lastClickId = null;
        this._dragState = null;
        this._listeners = [];
        this._items = [];
      }

      setItems(items) {
        this._items = items;
      }

      get selected() {
        return new Set(this._selected);
      }

      get size() {
        return this._selected.size;
      }

      has(id) {
        return this._selected.has(id);
      }

      clear() {
        this._selected.clear();
        this._notify();
      }

      add(id) {
        this._selected.add(id);
        this._notify();
      }

      delete(id) {
        this._selected.delete(id);
        this._notify();
      }

      selectAll() {
        this._items.forEach(item => this._selected.add(item.id));
        this._notify();
      }

      _notify() {
        this._onSelectionChange(new Set(this._selected));
      }

      /**
       * Handle item click with modifier keys
       */
      handleItemClick(e, item) {
        const id = item.id;

        if (e.ctrlKey || e.metaKey) {
          // Toggle single item
          if (this._selected.has(id)) {
            this._selected.delete(id);
          } else {
            this._selected.add(id);
          }
          this._lastClickId = id;
        } else if (e.shiftKey && this._lastClickId) {
          // Range select
          const ids = this._items.map(i => i.id);
          const fromIdx = ids.indexOf(this._lastClickId);
          const toIdx = ids.indexOf(id);
          if (fromIdx !== -1 && toIdx !== -1) {
            const [start, end] = [Math.min(fromIdx, toIdx), Math.max(fromIdx, toIdx)];
            for (let i = start; i <= end; i++) {
              this._selected.add(ids[i]);
            }
          }
        } else {
          // Single select
          this._selected.clear();
          this._selected.add(id);
          this._lastClickId = id;
        }

        this._notify();
      }

      /**
       * Set up drag-to-select on a container element
       */
      setupDragSelect(container) {
        this.cleanup(); // remove any listeners from a previous render — this was leaking before
        const selBox = document.getElementById('sel-box');
        if (!selBox || !container) return;

        let startX = 0, startY = 0, active = false;
        let cachedRects = null; // computed once per drag, not on every move — avoids per-frame layout thrash
        let longPressTimer = null;

        const beginAt = (clientX, clientY, additive) => {
          active = true;
          const rect = container.getBoundingClientRect();
          startX = clientX - rect.left;
          startY = clientY - rect.top + container.scrollTop;

          if (!additive) { this._selected.clear(); this._notify(); }

          cachedRects = [...container.querySelectorAll('.fi, .fl-row, .gal-item')].map(el => ({
            id: el.dataset.id,
            r: el.getBoundingClientRect()
          }));

          selBox.style.cssText = `display:block;left:${startX}px;top:${startY - container.scrollTop}px;width:0;height:0`;
        };

        const moveTo = (clientX, clientY, additive) => {
          if (!active) return;
          const rect = container.getBoundingClientRect();

          const rawX = clientX - rect.left;
          const rawY = clientY - rect.top + container.scrollTop;
          const cX = Math.max(0, Math.min(rawX, rect.width));
          const cY = Math.max(0, Math.min(rawY, container.scrollHeight));

          const x = Math.min(startX, cX);
          const y = Math.min(startY, cY);
          const w = Math.abs(cX - startX);
          const h = Math.abs(cY - startY);

          const displayY = y - container.scrollTop;
          selBox.style.cssText = `display:block;left:${x}px;top:${displayY}px;width:${w}px;height:${h}px`;

          const boxVP = {
            left: x + rect.left,
            top: displayY + rect.top,
            right: x + rect.left + w,
            bottom: displayY + rect.top + h
          };

          if (!additive) this._selected.clear();
          (cachedRects || []).forEach(({ id, r }) => {
            const overlaps = !(r.right < boxVP.left || r.left > boxVP.right || r.bottom < boxVP.top || r.top > boxVP.bottom);
            if (overlaps) this._selected.add(id);
          });

          this._notify();
        };

        const endDrag = () => {
          active = false;
          cachedRects = null;
          selBox.style.display = 'none';
        };

        // ── Mouse ──
        const onMouseDown = e => {
          if (e.button !== 0) return;
          if (e.target.closest('.fi, .fl-row, .gal-item, .cb-btn, .nav-btn')) return;
          beginAt(e.clientX, e.clientY, e.ctrlKey || e.metaKey || e.shiftKey);
          e.preventDefault();
        };
        // rAF-throttled so we don't do selection math more than once per frame during fast mouse moves
        let mouseRaf = null;
        const onMouseMove = e => {
          if (!active) return;
          if (mouseRaf) return;
          mouseRaf = requestAnimationFrame(() => { mouseRaf = null; moveTo(e.clientX, e.clientY, e.ctrlKey || e.metaKey); });
        };
        const onMouseUp = () => endDrag();

        container.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);

        // ── Touch: long-press on empty space starts a marquee (so a normal
        // scroll swipe on the file area isn't accidentally hijacked) ──
        const onTouchStart = e => {
          if (e.touches.length !== 1) return;
          if (e.target.closest('.fi, .fl-row, .gal-item, .cb-btn, .nav-btn')) return;
          const t = e.touches[0];
          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(() => {
            beginAt(t.clientX, t.clientY, false);
            if (navigator.vibrate) navigator.vibrate(12);
          }, 380);
        };
        const onTouchMove = e => {
          if (!active) { clearTimeout(longPressTimer); return; }
          e.preventDefault();
          const t = e.touches[0];
          moveTo(t.clientX, t.clientY, false);
        };
        const onTouchEnd = () => { clearTimeout(longPressTimer); endDrag(); };

        container.addEventListener('touchstart', onTouchStart, { passive: true });
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd);
        window.addEventListener('touchcancel', onTouchEnd);

        // Store listeners for cleanup
        this._listeners.push(
          { el: container, type: 'mousedown', fn: onMouseDown },
          { el: window, type: 'mousemove', fn: onMouseMove },
          { el: window, type: 'mouseup', fn: onMouseUp },
          { el: container, type: 'touchstart', fn: onTouchStart },
          { el: window, type: 'touchmove', fn: onTouchMove },
          { el: window, type: 'touchend', fn: onTouchEnd },
          { el: window, type: 'touchcancel', fn: onTouchEnd }
        );
      }

      cleanup() {
        this._listeners.forEach(({ el, type, fn }) => el.removeEventListener(type, fn));
        this._listeners = [];
      }
    }

    // ════════════════════════════════════════════════════════════
    // UI: Modals / Dialogs
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - Modals Module
     * Dialog system: confirm, prompt, password, properties, tags
     */

    // Global modal promise resolver — ensures overlay-click always resolves pending promises
    let _modalResolve = null;

    function initModals() {
      const ovl = document.getElementById('movl');
      if (!ovl) return;
      ovl.addEventListener('click', e => {
        if (e.target === ovl) closeModal();
      });
    }

    function closeModal() {
      const ovl = document.getElementById('movl');
      if (ovl) ovl.classList.remove('on');
      if (_modalResolve) {
        const fn = _modalResolve;
        _modalResolve = null;
        fn();
      }
    }

    /**
     * Generic modal dialog
     * @param {string} title
     * @param {string|HTMLElement} content
     * @param {Array<{label,cls,val}>} buttons
     * @returns {Promise<any>}
     */
    function showModal(title, content, buttons) {
      return new Promise(resolve => {
        const ovl = document.getElementById('movl');
        const titleEl = document.getElementById('mt');
        const bodyEl = document.getElementById('mb');
        const btnsEl = document.getElementById('mbts');

        titleEl.textContent = title;
        bodyEl.innerHTML = '';
        btnsEl.innerHTML = '';

        if (typeof content === 'string') {
          bodyEl.innerHTML = content;
        } else {
          bodyEl.appendChild(content);
        }

        _modalResolve = () => resolve(undefined);
        buttons.forEach(b => {
          const btn = document.createElement('button');
          btn.textContent = b.label;
          btn.className = 'mbtn ' + (b.cls || '');
          btn.onclick = () => {
            _modalResolve = null;
            closeModal();
            resolve(b.val);
          };
          btnsEl.appendChild(btn);
        });

        ovl.classList.add('on');
        // Focus first button
        setTimeout(() => btnsEl.querySelector('button')?.focus(), 50);
      });
    }

    /**
     * Confirm dialog
     */
    async function confirm(title, message, danger = false) {
      return showModal(
        title,
        `<p style="color:var(--text2);line-height:1.55">${message}</p>`,
        [
          { label: 'Cancel', cls: 'sec', val: false },
          { label: 'Confirm', cls: danger ? 'dng' : 'pri', val: true }
        ]
      );
    }

    /**
     * Text prompt dialog
     */
    async function prompt(title, label = '', defaultValue = '') {
      const wrap = document.createElement('div');
      if (label) {
        const lbl = document.createElement('label');
        lbl.textContent = label;
        lbl.style.cssText = 'display:block;font-size:12px;color:var(--text2);margin-bottom:6px';
        wrap.appendChild(lbl);
      }
      const inp = document.createElement('input');
      inp.className = 'minp';
      inp.type = 'text';
      inp.value = defaultValue;
      inp.placeholder = label;
      wrap.appendChild(inp);

      setTimeout(() => { inp.focus(); inp.select(); }, 80);

      const result = await new Promise(resolve => {
        inp.onkeydown = e => {
          if (e.key === 'Enter') resolve(true);
          if (e.key === 'Escape') { _modalResolve = null; closeModal(); resolve(false); }
        };

        const btns = document.getElementById('mbts');
        const titleEl = document.getElementById('mt');
        const bodyEl = document.getElementById('mb');
        const ovl = document.getElementById('movl');

        titleEl.textContent = title;
        bodyEl.innerHTML = '';
        bodyEl.appendChild(wrap);
        btns.innerHTML = '';

        const cancel = document.createElement('button');
        cancel.textContent = 'Cancel';
        cancel.className = 'mbtn sec';
        cancel.onclick = () => { _modalResolve = null; closeModal(); resolve(false); };

        const ok = document.createElement('button');
        ok.textContent = 'OK';
        ok.className = 'mbtn pri';
        ok.onclick = () => { _modalResolve = null; closeModal(); resolve(true); };

        btns.appendChild(cancel);
        btns.appendChild(ok);
        _modalResolve = () => resolve(false);
        ovl.classList.add('on');
      });

      return result ? inp.value.trim() : null;
    }

    /**
     * Password dialog (with optional strength indicator)
     */
    async function promptPassword(title, { confirm: needConfirm = false, label = 'Password', checkStrength } = {}) {
      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'column';
      wrap.style.gap = '10px';

      const pw1wrap = document.createElement('div');
      const pw1lbl = document.createElement('label');
      pw1lbl.textContent = label;
      pw1lbl.style.cssText = 'display:block;font-size:12px;color:var(--text2);margin-bottom:4px';
      const pw1 = document.createElement('input');
      pw1.type = 'password';
      pw1.className = 'minp';
      pw1.placeholder = label;
      pw1wrap.appendChild(pw1lbl);
      pw1wrap.appendChild(pw1);
      wrap.appendChild(pw1wrap);

      // Strength bar
      const strengthBar = document.createElement('div');
      strengthBar.style.cssText = 'height:3px;border-radius:2px;background:var(--surface3);overflow:hidden;display:none';
      const strengthFill = document.createElement('div');
      strengthFill.style.cssText = 'height:100%;width:0;transition:width .3s,background .3s';
      strengthBar.appendChild(strengthFill);
      const strengthLabel = document.createElement('div');
      strengthLabel.style.cssText = 'font-size:11px;color:var(--text3);text-align:right;margin-top:2px;display:none';

      if (checkStrength) {
        wrap.appendChild(strengthBar);
        wrap.appendChild(strengthLabel);
        strengthBar.style.display = '';
        strengthLabel.style.display = '';
        pw1.addEventListener('input', () => {
          const s = checkStrength(pw1.value);
          const pct = Math.round((s.score / 6) * 100);
          strengthFill.style.width = pct + '%';
          strengthFill.style.background = s.color;
          strengthLabel.textContent = s.label;
          strengthLabel.style.color = s.color;
        });
      }

      let pw2 = null;
      if (needConfirm) {
        const pw2wrap = document.createElement('div');
        const pw2lbl = document.createElement('label');
        pw2lbl.textContent = 'Confirm ' + label;
        pw2lbl.style.cssText = 'display:block;font-size:12px;color:var(--text2);margin-bottom:4px';
        pw2 = document.createElement('input');
        pw2.type = 'password';
        pw2.className = 'minp';
        pw2.placeholder = 'Confirm ' + label;
        pw2wrap.appendChild(pw2lbl);
        pw2wrap.appendChild(pw2);
        wrap.appendChild(pw2wrap);
      }

      const errEl = document.createElement('div');
      errEl.style.cssText = 'color:var(--danger);font-size:12px;min-height:16px';
      wrap.appendChild(errEl);

      return new Promise(resolve => {
        const ovl = document.getElementById('movl');
        document.getElementById('mt').textContent = title;
        const bodyEl = document.getElementById('mb');
        bodyEl.innerHTML = '';
        bodyEl.appendChild(wrap);
        const btns = document.getElementById('mbts');
        btns.innerHTML = '';

        const cancel = document.createElement('button');
        cancel.textContent = 'Cancel';
        cancel.className = 'mbtn sec';
        cancel.onclick = () => { _modalResolve = null; closeModal(); resolve(null); };

        const ok = document.createElement('button');
        ok.textContent = 'Confirm';
        ok.className = 'mbtn pri';
        ok.onclick = () => {
          if (!pw1.value) { errEl.textContent = 'Password required'; return; }
          if (needConfirm && pw1.value !== pw2.value) { errEl.textContent = 'Passwords do not match'; return; }
          _modalResolve = null;
          closeModal();
          resolve(pw1.value);
        };

        btns.appendChild(cancel);
        btns.appendChild(ok);
        _modalResolve = () => resolve(null);
        ovl.classList.add('on');
        setTimeout(() => pw1.focus(), 50);
      });
    }

    /**

    async function showTagEditor(currentTags = []) {
      const ALL_TAGS = ['Work', 'Personal', 'Important', 'Archive', 'Media', 'Documents', 'Projects', 'Secret'];

      const wrap = document.createElement('div');

        chip.textContent = tag;
        chip.style.cssText = `

      border-radius: 20px;

      const result = await showModal('Edit Tags', wrap, [

    // ════════════════════════════════════════════════════════════
    // UI: File Preview
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - Preview Module
     * File preview: images, video, audio, text, PDF
     * Gallery navigation with keyboard support
     */

    const IMAGE_TYPES = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp', 'image/svg+xml', 'image/bmp'];
    const VIDEO_TYPES = ['video/mp4', 'video/webm', 'video/ogg', 'video/quicktime'];
    const AUDIO_TYPES = ['audio/mpeg', 'audio/ogg', 'audio/wav', 'audio/flac', 'audio/aac', 'audio/mp4'];
    const TEXT_TYPES = ['text/plain', 'text/html', 'text/css', 'text/javascript', 'application/json', 'text/xml', 'text/csv', 'text/markdown'];
    const PDF_TYPE = 'application/pdf';

    let _pvItems = [];
    let _pvIdx = 0;
    let _getDataFn = null;
    let _blobUrls = new Map();

    function initPreview(getDataFn) {
      _getDataFn = getDataFn;

      const ovl = document.getElementById('pvovl');
      const closeBtn = document.getElementById('pvcls');
      const prevBtn = document.getElementById('pv-prev');
      const nextBtn = document.getElementById('pv-next');

      if (closeBtn) closeBtn.onclick = closePreview;
      if (prevBtn) prevBtn.onclick = () => navigate(-1);
      if (nextBtn) nextBtn.onclick = () => navigate(1);
      if (ovl) ovl.addEventListener('click', e => { if (e.target === ovl) closePreview(); });
    }

    function setPreviewItems(items) {
      _pvItems = items;
    }

    async function openPreview(item, items = null) {
      if (items) _pvItems = items;
      _pvIdx = _pvItems.findIndex(i => i.id === item.id);
      if (_pvIdx === -1) { _pvIdx = 0; _pvItems = [item]; }
      await renderPreview();
    }

    function closePreview() {
      const ovl = document.getElementById('pvovl');
      if (ovl) ovl.classList.remove('on');
      // Revoke all blob URLs
      _blobUrls.forEach(url => URL.revokeObjectURL(url));
      _blobUrls.clear();
      // Clear content
      const pvc = document.getElementById('pvc');
      if (pvc) pvc.innerHTML = '';
    }

    function navigate(dir) {
      const newIdx = _pvIdx + dir;
      if (newIdx < 0 || newIdx >= _pvItems.length) return;
      _pvIdx = newIdx;
      renderPreview();
    }

    async function renderPreview() {
      const ovl = document.getElementById('pvovl');
      const fnEl = document.getElementById('pvfn');
      const pvc = document.getElementById('pvc');
      const infoEl = document.getElementById('pv-info');
      const prevBtn = document.getElementById('pv-prev');
      const nextBtn = document.getElementById('pv-next');

      if (!ovl || !pvc) return;

      const item = _pvItems[_pvIdx];
      if (!item) return;

      if (fnEl) fnEl.textContent = item.name;
      pvc.innerHTML = '<div class="pv-loading"><div class="pv-spinner"></div></div>';
      ovl.classList.add('on');

      // Navigation
      if (prevBtn) prevBtn.style.display = _pvItems.length > 1 ? '' : 'none';
      if (nextBtn) nextBtn.style.display = _pvItems.length > 1 ? '' : 'none';
      if (prevBtn) prevBtn.classList.toggle('dis', _pvIdx === 0);
      if (nextBtn) nextBtn.classList.toggle('dis', _pvIdx === _pvItems.length - 1);

      if (infoEl) {
        infoEl.textContent = _pvItems.length > 1 ? `${_pvIdx + 1} / ${_pvItems.length}` : '';
      }

      try {
        const data = await _getDataFn(item.id);
        const mime = item.mimeType || guessMime(item.name);

        // Revoke previous blob for this item
        if (_blobUrls.has(item.id)) {
          URL.revokeObjectURL(_blobUrls.get(item.id));
        }

        const blob = new Blob([data], { type: mime });
        const url = URL.createObjectURL(blob);
        _blobUrls.set(item.id, url);

        pvc.innerHTML = '';

        if (IMAGE_TYPES.includes(mime)) {
          const img = document.createElement('img');
          img.src = url;
          img.alt = item.name;
          img.className = 'pv-img';
          img.ondblclick = () => img.classList.toggle('pv-img-full');
          pvc.appendChild(img);
        } else if (VIDEO_TYPES.includes(mime)) {
          const vid = document.createElement('video');
          vid.src = url;
          vid.controls = true;
          vid.autoplay = true;
          vid.className = 'pv-video';
          pvc.appendChild(vid);
        } else if (AUDIO_TYPES.includes(mime)) {
          const wrap = document.createElement('div');
          wrap.className = 'pv-audio-wrap';
          wrap.innerHTML = `
        <div class="pv-audio-icon">
          <svg viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="30" stroke="var(--accent)" stroke-width="2" opacity=".2"/>
            <circle cx="32" cy="32" r="22" stroke="var(--accent)" stroke-width="1.5" opacity=".35"/>
            <circle cx="32" cy="32" r="8" fill="var(--accent)" opacity=".7"/>
            <path d="M32 20v-6M32 50v-6M20 32h-6M50 32h-6M23.5 23.5l-4-4M44.5 44.5l-4-4M23.5 40.5l-4 4M44.5 19.5l-4 4" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
          </svg>
        </div>
        <div class="pv-audio-name">${item.name}</div>
      `;
          const audio = document.createElement('audio');
          audio.src = url;
          audio.controls = true;
          audio.autoplay = true;
          audio.style.width = '100%';
          wrap.appendChild(audio);
          pvc.appendChild(wrap);
        } else if (TEXT_TYPES.includes(mime)) {
          const text = new TextDecoder().decode(data);
          const pre = document.createElement('pre');
          pre.className = 'pv-text';
          // Syntax highlight hint
          const ext = item.name.split('.').pop()?.toLowerCase();
          pre.dataset.lang = ext || '';
          pre.textContent = text;
          pvc.appendChild(pre);
        } else if (mime === PDF_TYPE) {
          const iframe = document.createElement('iframe');
          iframe.src = url;
          iframe.className = 'pv-iframe';
          iframe.title = item.name;
          pvc.appendChild(iframe);
        } else if (mime === 'text/html' || item.name.endsWith('.html')) {
          // HTML runner - sandboxed
          const frame = document.createElement('iframe');
          frame.src = url;
          frame.sandbox = 'allow-scripts allow-forms allow-popups';
          frame.className = 'pv-iframe';
          frame.title = item.name;
          pvc.appendChild(frame);
        } else {
          pvc.innerHTML = `
        <div class="pv-unsupported">
          <svg viewBox="0 0 64 64" fill="none" style="width:64px;height:64px;opacity:.3">
            <path d="M12 8a4 4 0 014-4h22l16 16v36a4 4 0 01-4 4H16a4 4 0 01-4-4V8z" stroke="currentColor" stroke-width="2"/>
            <path d="M38 4v16h16" stroke="currentColor" stroke-width="2"/>
          </svg>
          <p>No preview available for this file type</p>
          <p style="font-size:12px;color:var(--text3)">${mime || 'Unknown type'}</p>
        </div>
      `;
        }
      } catch (err) {
        pvc.innerHTML = `<div class="pv-error"><p>Failed to preview file</p><p style="font-size:12px;color:var(--text3)">${err.message}</p></div>`;
      }
    }

    function guessMime(name) {
      if (!name) return '';
      const ext = name.split('.').pop()?.toLowerCase();
      const map = {
        jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
        webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp',
        mp4: 'video/mp4', webm: 'video/webm', ogg: 'video/ogg', mov: 'video/quicktime',
        mp3: 'audio/mpeg', wav: 'audio/wav', flac: 'audio/flac', aac: 'audio/aac',
        txt: 'text/plain', html: 'text/html', css: 'text/css', js: 'text/javascript',
        json: 'application/json', xml: 'text/xml', csv: 'text/csv', md: 'text/markdown',
        pdf: 'application/pdf', zip: 'application/zip'
      };
      return map[ext] || 'application/octet-stream';
    }

    // Keyboard navigation (called from main)
    function handlePreviewKey(e) {
      const ovl = document.getElementById('pvovl');
      if (!ovl?.classList.contains('on')) return false;
      if (e.key === 'ArrowLeft') { navigate(-1); return true; }
      if (e.key === 'ArrowRight') { navigate(1); return true; }
      if (e.key === 'Escape') { closePreview(); return true; }
      return false;
    }

    // Thumbnail loading with IntersectionObserver
    let _thumbObserver = null;
    const _thumbCache = new Map();

    function getThumbObserver(getDataFn) {
      if (_thumbObserver) return _thumbObserver;
      _thumbObserver = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            const img = entry.target;
            const id = img.dataset.thumbId;
            if (id) {
              _thumbObserver.unobserve(img);
              loadThumb(id, img, getDataFn || _getDataFn);
            }
          }
        }
      }, { rootMargin: '120px' });
      return _thumbObserver;
    }

    async function loadThumb(id, img, getDataFn) {
      if (_thumbCache.has(id)) { img.src = _thumbCache.get(id); return; }
      try {
        const data = await getDataFn(id);
        const url = URL.createObjectURL(new Blob([data]));
        _thumbCache.set(id, url);
        img.src = url;
      } catch { img.style.display = 'none'; }
    }

    function clearThumbCache() {
      _thumbCache.forEach(url => URL.revokeObjectURL(url));
      _thumbCache.clear();
      if (_thumbObserver) { _thumbObserver.disconnect(); _thumbObserver = null; }
    }

    // ════════════════════════════════════════════════════════════

    /**
     * SecureVault - Sidebar Module

    const CAT_ICONS = {
      Documents: `<svg viewBox="0 0 20 20" fill="none"><path d="M4 3a1 1 0 011-1h6l4 4v11a1 1 0 01-1 1H5a1 1 0 01-1-1V3z" stroke="#64B5F6" stroke-width="1.3"/><path d="M10 2v4h4" stroke="#64B5F6" stroke-width="1.3"/></svg>`,

    };

    async function initSidebar({ onNav, onVaultToggle, curFolder, showHidden }) {
      await renderSidebar({ onNav, onVaultToggle, curFolder, showHidden });
    }

    async function renderSidebar({ onNav, curFolder, showHidden }) {
      const el = document.getElementById('sidebar');
      if (!el) return;

      // Update active state
      const items = el.querySelectorAll('.sb-item');
      items.forEach(i => i.classList.remove('active'));

      // Home
      const homeEl = el.querySelector('[data-sb="home"]');
      if (homeEl && curFolder === ROOT) homeEl.classList.add('active');

      // Categories
      const kids = await getKids(ROOT);
      const catFolders = {};
      kids.filter(k => k.type === 'folder' && CATEGORIES.includes(k.name)).forEach(f => {
        catFolders[f.name] = f;
      });

      // Re-render dynamic parts
      await renderFolderTree(el, onNav, curFolder);
      await renderRecents(el, onNav);
      await renderFavorites(el, onNav);
    }

    async function renderFolderTree(sidebar, onNav, curFolder) {
      const el = document.getElementById('sb-folders');
      if (!el) return;
      el.innerHTML = '';
      const kids = await getKids(ROOT);
      const custom = kids.filter(k => k.type === 'folder' && !CATEGORIES.includes(k.name));
      custom.forEach(f => {
        const item = document.createElement('div');
        item.className = 'sb-item sb-tree-item' + (curFolder === f.id ? ' active' : '');
        item.innerHTML = `
      <div class="sb-ico">${folderIcon()}</div>
      <span title="${f.name}">${f.name}</span>
    `;
        item.onclick = () => onNav(f.id);
        FileDnD.makeDropTarget(item, { folderId: f.id });
        el.appendChild(item);

    async function renderRecents(sidebar, onNav) {
      const el = document.getElementById('sb-recents');
      if (!el) return;
      const clearBtn = document.getElementById('sb-clear-recent');
      if (clearBtn && !clearBtn._wired) {
        clearBtn._wired = true;
        clearBtn.onclick = async e => {
          e.stopPropagation();
          const ok = await confirm('Clear Recent', 'Remove all items from your Recent list? This does not delete any files.');
          if (!ok) return;
          await clearRecentFiles();
          await renderRecents(sidebar, onNav);
          toast('Recent files cleared', 'i');
        };
      }
      const recents = await getRecentFiles();
      el.innerHTML = '';
      if (clearBtn) clearBtn.style.display = recents.length ? '' : 'none';
      if (!recents.length) {
        el.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:4px 8px">No recent files</div>';

    async function renderFavorites(sidebar, onNav) {
      const el = document.getElementById('sb-favs');
      if (!el) return;
      const favs = await getFavorites();

        el.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:4px 8px">No favorites</div>';
        return;
      }

    function folderIcon() {
      return `<svg viewBox="0 0 16 16" fill="none"><path d="M1.5 4c0-.83.67-1.5 1.5-1.5h3.5L7.5 4H13c.83 0 1.5.67 1.5 1.5v7c0 .83-.67 1.5-1.5 1.5H3c-.83 0-1.5-.67-1.5-1.5V4z" fill="#FFD000" stroke="#FFB900" stroke-width=".7"/></svg>`;
    }

    function fileIconSmall(mime) {
      if (!mime) return `<svg viewBox="0 0 16 16" fill="none"><path d="M3 2a1 1 0 011-1h5l3 3v10a1 1 0 01-1 1H4a1 1 0 01-1-1V2z" stroke="#8B8FA8" stroke-width="1"/></svg>`;
      if (mime.startsWith('image/')) return `<svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" rx="2" stroke="#0EA5E9" stroke-width="1"/></svg>`;
      if (mime.startsWith('video/')) return `<svg viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="10" height="12" rx="2" stroke="#A855F7" stroke-width="1"/></svg>`;

    }

    function initMobileSidebar() {

    // ════════════════════════════════════════════════════════════
    // FEATURE: Mobile Gestures
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - Gestures Module
     * Mobile gestures: swipe sidebar, vault drag, touch support
     */

    function initGestures({ onOpenSidebar, onOpenHiddenVault }) {
      setupSwipeGesture(onOpenSidebar);
      setupEdgeDragVault(onOpenHiddenVault);
      setupLongPress();
    }

    /**
     * Swipe from left edge to open sidebar
     */
    function setupSwipeGesture(onOpenSidebar) {
      let startX = 0, startY = 0, tracking = false;

      document.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        tracking = startX < 20; // Only track from left edge
      }, { passive: true });

      document.addEventListener('touchend', e => {
        if (!tracking) return;
        const touch = e.changedTouches[0];
        const dx = touch.clientX - startX;
        const dy = Math.abs(touch.clientY - startY);

        if (dx > 50 && dy < 80) {
          onOpenSidebar?.();
        }
        tracking = false;
      }, { passive: true });
    }

    /**
     * Drag from bottom of file container to reveal hidden vault
     */
    function setupEdgeDragVault(onOpenHiddenVault) {
      let startY = 0, startX = 0, tracking = false;
      const fc = document.getElementById('fc');
      if (!fc) return;

      fc.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        startY = touch.clientY;
        startX = touch.clientX;
        const rect = fc.getBoundingClientRect();
        // Activate when touching bottom 30px of the container
        tracking = touch.clientY > rect.bottom - 30;
      }, { passive: true });

      fc.addEventListener('touchend', e => {
        if (!tracking) return;
        const touch = e.changedTouches[0];
        const dy = startY - touch.clientY; // negative = dragging up
        const dx = Math.abs(touch.clientX - startX);

        if (dy > 60 && dx < 60) {
          onOpenHiddenVault?.();
        }
        tracking = false;
      }, { passive: true });

      // Desktop: drag from bottom of fc while holding Alt
      let mouseStartY = 0, mouseTracking = false;
      fc.addEventListener('mousedown', e => {
        if (!e.altKey) return;
        const rect = fc.getBoundingClientRect();
        mouseTracking = e.clientY > rect.bottom - 30;
        mouseStartY = e.clientY;
      });
      window.addEventListener('mouseup', e => {
        if (!mouseTracking) return;
        mouseTracking = false;
        const dy = mouseStartY - e.clientY;
        if (dy > 60) onOpenHiddenVault?.();
      });
    }

    /**
     * Long-press context menu for touch devices
     */
    function setupLongPress() {
      let timer = null;
      let moved = false;

      document.addEventListener('touchstart', e => {
        const el = e.target.closest('.fi, .fl-row, .gal-item');
        if (!el) return;
        moved = false;
        timer = setTimeout(() => {
          if (!moved && el._contextMenuFn) {
            const touch = e.touches[0];
            el._contextMenuFn({ clientX: touch.clientX, clientY: touch.clientY });
          }
        }, 600);
      }, { passive: true });

      document.addEventListener('touchmove', () => {
        moved = true;
        clearTimeout(timer);
      }, { passive: true });

      document.addEventListener('touchend', () => {
        clearTimeout(timer);
      }, { passive: true });

      document.addEventListener('touchcancel', () => {
        clearTimeout(timer);
        moved = false;
      }, { passive: true });
    }

    /**
     * Attach a context menu handler to an element for long-press
     */
    function attachLongPress(el, fn) {
      el._contextMenuFn = fn;
    }

    // ════════════════════════════════════════════════════════════
    // FEATURE: Hidden Vault
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - Hidden Vault Module
     * Hidden files system and secret vault with separate password
     */





    const HIDDEN_VAULT_META = 'hiddenVault';
    const HIDDEN_VAULT_ROOT = '__hidden_root__';



    /**
     * Initialize or load the hidden vault
     */
    async function initHiddenVault() {
      const meta = await getMeta(HIDDEN_VAULT_META);
      return !!meta;
    }

    /**
     * Open the hidden vault UI
     */
    async function openHiddenVault({ onEnter }) {
      const meta = await getMeta(HIDDEN_VAULT_META);

      if (!meta) {
        // First time - set up hidden vault
        const result = await showModal(
          '⚠ Hidden Vault',
          `<div style="line-height:1.7;color:var(--text2);font-size:13px">
        <p>The <strong style="color:var(--accent)">Hidden Vault</strong> stores files that are completely invisible until unlocked with a separate password.</p>
        <br/>
        <p style="color:var(--warn);font-size:12px">⚠ This password is <strong>separate</strong> from your main vault password and cannot be recovered if lost.</p>
      </div>`,
          [
            { label: 'Cancel', cls: 'sec', val: false },
            { label: 'Create Hidden Vault', cls: 'pri', val: true }
          ]
        );
        if (!result) return;

        const pw = await promptPassword('Create Hidden Vault Password', {
          confirm: true,
          label: 'Hidden Vault Password',
          checkStrength: checkPasswordStrength
        });
        if (!pw) return;

        try {
          const creds = await setupHiddenVault(pw);
          await setMeta(HIDDEN_VAULT_META, {
            salt: creds.salt,
            iv: creds.iv,
            token: creds.token,
            createdAt: Date.now()
          });
          toast('Hidden vault created!', 's');
          onEnter?.();
        } catch (e) {
          toast('Failed to create hidden vault: ' + e.message, 'e');
        }
      } else {
        // Already set up — unlock it
        if (isHiddenUnlocked()) {
          onEnter?.();
          return;
        }

        const pw = await promptPassword('Unlock Hidden Vault', {
          label: 'Hidden Vault Password'
        });
        if (!pw) return;

        try {
          const ok = await unlockHiddenVault(pw, meta.salt, meta.iv, meta.token);
          if (ok) {
            toast('Hidden vault unlocked', 's');
            onEnter?.();
          } else {
            toast('Incorrect hidden vault password', 'e');
          }
        } catch (e) {
          toast('Unlock error: ' + e.message, 'e');
        }
      }
    }

    function closeHiddenVault() {
      lockHiddenVault();
    }

    /**
     * Change hidden vault password
     */
    async function changeHiddenVaultPassword() {
      const meta = await getMeta(HIDDEN_VAULT_META);
      if (!meta) { toast('No hidden vault exists', 'w'); return; }

      // Verify current password
      const currentPw = await promptPassword('Verify Current Password', {
        label: 'Current Hidden Vault Password'
      });
      if (!currentPw) return;

      const ok = await unlockHiddenVault(currentPw, meta.salt, meta.iv, meta.token);
      if (!ok) { toast('Incorrect current password', 'e'); return; }

      // Set new password
      const newPw = await promptPassword('Set New Password', {
        confirm: true,
        label: 'New Hidden Vault Password',
        checkStrength: checkPasswordStrength
      });
      if (!newPw) return;

      try {
        const creds = await setupHiddenVault(newPw);
        await setMeta(HIDDEN_VAULT_META, {
          salt: creds.salt,
          iv: creds.iv,
          token: creds.token,
          updatedAt: Date.now()
        });
        toast('Hidden vault password changed', 's');
      } catch (e) {
        toast('Failed to change password: ' + e.message, 'e');
      }
    }

    // Toast helper (fallback if not imported)
    function toast(msg, type = 'i') {

    // ════════════════════════════════════════════════════════════
    // FEATURE: HTML App Runner
    // ════════════════════════════════════════════════════════════
    /**
     * SecureVault - HTML Runner Module
     * Runs HTML files as sandboxed applications in a custom window UI
     */

    // ════════════════════════════════════════════════════════════════
    //  WINDOW MANAGER  — multi-window, taskbar, virtual HTML runtime
    // ════════════════════════════════════════════════════════════════
    const WM = (() => {
      let windows = [];          // { id, el, type, item, minimized, maximized, zIdx, blobUrls }
      let zCounter = 100;
      let focused = null;

      const layer = () => document.getElementById('wm-layer');
      const tbRun = () => document.getElementById('tb-running');

      // ── Generate unique window id ──────────────────────────────
      const wid = () => 'w_' + Math.random().toString(36).slice(2, 8);

      // ── Focus a window ─────────────────────────────────────────
      function focus(id) {
        const win = windows.find(w => w.id === id);
        if (!win || win.minimized) return;
        zCounter++;
        win.el.style.zIndex = zCounter;
        win.zIdx = zCounter;

      // ── Close a window ─────────────────────────────────────────
      function close(id) {
        const win = windows.find(w => w.id === id);

        (win.blobUrls || []).forEach(u => { try { URL.revokeObjectURL(u); } catch { } });

      // ── Minimize / restore ────────────────────────────────────
      function toggleMinimize(id) {
        const win = windows.find(w => w.id === id);
        if (!win) return;
        win.minimized = !win.minimized;
        win.el.classList.toggle('wm-minimized', win.minimized);
        if (!win.minimized) focus(id);
        _refreshTaskbar();
      }

      // ── Maximize / restore ────────────────────────────────────
      function toggleMaximize(id) {
        const win = windows.find(w => w.id === id);
        if (!win) return;

          win.maximized = true;
          win.el.classList.add('wm-animating', 'wm-maximized');
        } else {
          win.maximized = false;
          win.el.classList.remove('wm-maximized');
          if (win._savedRect) {
            win.el.classList.add('wm-animating');
            Object.assign(win.el.style, win._savedRect);
          }
        }
        setTimeout(() => win.el.classList.remove('wm-animating'), 250);
        focus(id);
      }

      // ── Make draggable ────────────────────────────────────────
      // ── Snap zones: edge/corner drag → half/quarter/full screen ──
      const SNAP_MARGIN = 22; // px from screen edge that triggers a snap zone
      function _taskH() { return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')) || 60; }
      function _snapPreviewEl() {
        let el = document.getElementById('wm-snap-preview');
        if (!el) {
          el = document.createElement('div');
          el.id = 'wm-snap-preview';
          document.body.appendChild(el);
        }
        return el;
      }
      // Returns a rect {left,top,width,height} for a given zone, or null
      function _snapRect(zone) {
        const W = window.innerWidth, H = window.innerHeight - _taskH();
        switch (zone) {
          case 'left': return { left: 0, top: 0, width: W / 2, height: H };
          case 'right': return { left: W / 2, top: 0, width: W / 2, height: H };
          case 'top': return { left: 0, top: 0, width: W, height: H }; // full maximize
          case 'tl': return { left: 0, top: 0, width: W / 2, height: H / 2 };
          case 'tr': return { left: W / 2, top: 0, width: W / 2, height: H / 2 };
          case 'bl': return { left: 0, top: H / 2, width: W / 2, height: H / 2 };

        if (nearT && nearR) return 'tr';
        if (y > H - SNAP_MARGIN && nearL) return 'bl';
        if (y > H - SNAP_MARGIN && nearR) return 'br';
        if (nearT) return 'top';
        if (nearL) return 'left';
        if (nearR) return 'right';
        return null;

      function _showSnapPreview(zone) {
        const r = _snapRect(zone);
        const el = _snapPreviewEl();

        el.style.width = r.width + 'px'; el.style.height = r.height + 'px';
        el.classList.add('show');
      }
      function _hideSnapPreview() { _snapPreviewEl().classList.remove('show'); }
      function _applySnap(win, zone) {
        const r = _snapRect(zone);
        if (!r) return;
        win._savedRect = win._savedRect || { left: win.el.style.left, top: win.el.style.top, width: win.el.style.width, height: win.el.style.height };
        win.maximized = zone === 'top';
        win.el.classList.toggle('wm-maximized', win.maximized);
        win.el.classList.add('wm-animating');
        win.el.style.left = r.left + 'px'; win.el.style.top = r.top + 'px';
        win.el.style.width = r.width + 'px'; win.el.style.height = r.height + 'px';
        win.snapZone = zone;
        setTimeout(() => win.el.classList.remove('wm-animating'), 220);
      }

      // ── Shared pointer controller for drag + resize ────────────
      // Instead of each window/handle attaching its own window-level
      // mousemove/touchmove listeners (which used to leak — closed
      // windows never removed them, so listeners piled up over a
      // session and every pointer move did more and more work), all
      // windows share ONE controller and ONE set of listeners.
      let _activeOp = null; // { type:'drag'|'resize', win, ... }

      function _wmMove(cx, cy) {
        const op = _activeOp;
        if (!op) return;
        if (op.type === 'drag') {
          const win = op.win;
          const dx = cx - op.startX, dy = cy - op.startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) op.moved = true;
          const taskH = _taskH();
          const maxY = window.innerHeight - taskH - 40;
          const x = Math.max(-win.el.offsetWidth + 80, Math.min(window.innerWidth - 80, op.startL + dx));
          const y = Math.max(0, Math.min(Math.max(0, maxY), op.startT + dy));

          win.el.style.top = y + 'px';

          if (dir.includes('e')) win.el.style.width = Math.max(minW, op.startW + dx) + 'px';
          if (dir.includes('s')) win.el.style.height = Math.max(minH, op.startH + dy) + 'px';
          if (dir.includes('w')) { const nw = Math.max(minW, op.startW - dx); win.el.style.width = nw + 'px'; win.el.style.left = (op.startL + op.startW - nw) + 'px'; }

        }
      }
      function _wmUp() {
        const op = _activeOp;
        if (!op) return;
        if (op.type === 'drag') {
          op.win.el.classList.remove('wm-dragging');
          _hideSnapPreview();
          if (op.pendingZone) _applySnap(op.win, op.pendingZone);
        } else if (op.type === 'resize') {
          op.win.el.classList.remove('wm-resizing');
        }
        _activeOp = null;
      }

      window.addEventListener('mousemove', e => _wmMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', _wmUp);
      window.addEventListener('touchmove', e => {
        if (!_activeOp) return;
        e.preventDefault();
        const t = e.touches[0];
        _wmMove(t.clientX, t.clientY);
      }, { passive: false });
      window.addEventListener('touchend', _wmUp);
      window.addEventListener('touchcancel', _wmUp);

      // ── Make draggable (with edge/corner snapping) ─────────────
      function _makeDraggable(win) {
        const handle = win.el.querySelector('.wm-titlebar');
        if (!handle) return;

        const onDown = (cx, cy, target) => {
          if (target.closest('.wm-dot, .wm-tbtn, .wm-appnav-btn')) return;
          if (win.maximized) {
            // Grabbing the titlebar of a maximized window restores it first (Windows-style)
            const savedW = win._savedRect?.width ? parseFloat(win._savedRect.width) : win.el.offsetWidth * 0.6;
            toggleMaximize(win.id);
            const startL = cx - savedW / 2;
            win.el.style.left = Math.max(0, startL) + 'px';
          }
          win.el.classList.add('wm-dragging');
          focus(win.id);
          _activeOp = {
            type: 'drag', win,
            startX: cx, startY: cy,
            startL: win.el.offsetLeft, startT: win.el.offsetTop,
            moved: false, pendingZone: null
          };
        };

        handle.addEventListener('mousedown', e => { onDown(e.clientX, e.clientY, e.target); e.preventDefault(); });
        handle.addEventListener('touchstart', e => {
          const t = e.touches[0];
          onDown(t.clientX, t.clientY, e.target);
        }, { passive: true });
        handle.addEventListener('dblclick', e => {
          if (e.target.closest('.wm-dot, .wm-tbtn, .wm-appnav-btn')) return;
          toggleMaximize(win.id);
        });
      }

      // ── Make resizable (mouse + touch, all 8 handles) ──────────
      function _makeResizable(win) {
        const handles = win.el.querySelectorAll('.wm-resize');
        handles.forEach(h => {
          const dir = h.className.replace('wm-resize', '').trim();
          const begin = (cx, cy) => {
            if (win.maximized) return;
            win.el.classList.add('wm-resizing');
            focus(win.id);
            _activeOp = {
              type: 'resize', win, dir,
              startX: cx, startY: cy,
              startW: win.el.offsetWidth, startH: win.el.offsetHeight,
              startL: win.el.offsetLeft, startT: win.el.offsetTop
            };
          };
          h.addEventListener('mousedown', e => { begin(e.clientX, e.clientY); e.preventDefault(); e.stopPropagation(); });
          h.addEventListener('touchstart', e => {
            const t = e.touches[0];
            begin(t.clientX, t.clientY);
            e.preventDefault(); e.stopPropagation();
          }, { passive: false });
        });
      }

      // ── Build window chrome ────────────────────────────────────
      function _buildChrome(win, title, iconSvg, extraToolbar) {
        const el = win.el;
        // Titlebar
        const tb = document.createElement('div'); tb.className = 'wm-titlebar';
        const dots = document.createElement('div'); dots.className = 'wm-dots';
        const mkDot = (cls, label) => {
          const d = document.createElement('button'); d.className = 'wm-dot ' + cls;
          d.setAttribute('aria-label', label);
          d.title = label;

          if (cls === 'minimize') d.onclick = () => toggleMinimize(win.id);
          if (cls === 'maximize') d.onclick = () => toggleMaximize(win.id);
          return d;
        };
        dots.append(mkDot('close', 'Close'), mkDot('minimize', 'Minimize'), mkDot('maximize', 'Maximize / Restore'));
        const ico = document.createElement('span'); ico.className = 'wm-icon'; ico.innerHTML = iconSvg || '';
        const ttl = document.createElement('span'); ttl.className = 'wm-title'; ttl.textContent = title;
        tb.append(dots, ico, ttl);
        if (extraToolbar) tb.append(extraToolbar);
        el.append(tb);

        ['n', 's', 'e', 'w', 'se', 'sw', 'ne', 'nw'].forEach(d => {
          const r = document.createElement('div'); r.className = 'wm-resize ' + d; el.append(r);

        win.loadingEl = loadingOvl;

        el.classList.add('wm-opening');
        setTimeout(() => el.classList.remove('wm-opening'), 260);
      }

      // ── Loading indicator helpers (used by openHtml/openMedia/openText) ──
      function showLoading(win, label) {
        if (!win.loadingEl) return;
        const body = win.el.querySelector('.wm-body');
        if (body && !win.loadingEl.isConnected) body.appendChild(win.loadingEl);
        if (label) win.loadingEl.querySelector('.wm-loading-label').textContent = label;

      }
      function hideLoading(win) {
        if (!win.loadingEl) return;
        win.loadingEl.classList.add('hide');
        setTimeout(() => { try { win.loadingEl.remove(); } catch { } }, 220);
      }

      // ── Taskbar refresh ────────────────────────────────────────
      let _tbKnownIds = new Set();
      function _refreshTaskbar() {
        const slot = tbRun();
        if (!slot) return;
        const nextIds = new Set(windows.map(w => w.id));
        slot.innerHTML = '';
        windows.forEach(win => {
          const app = document.createElement('div');
          const isNew = !_tbKnownIds.has(win.id);
          app.className = 'tb-app running' + (win.minimized ? ' minimized' : '') + (focused === win.id && !win.minimized ? ' active' : '') + (isNew ? ' tb-just-opened' : '');
          app.dataset.label = (win.title || 'App').slice(0, 20);

          // Icon background color based on type
          const colors = { html: 'linear-gradient(135deg,#f59e0b,#ef4444)', image: 'linear-gradient(135deg,#ec4899,#8b5cf6)', video: 'linear-gradient(135deg,#8b5cf6,#3b82f6)', audio: 'linear-gradient(135deg,#10b981,#3b82f6)', text: 'linear-gradient(135deg,#64748b,#475569)', code: 'linear-gradient(135deg,#f59e0b,#84cc16)', pdf: 'linear-gradient(135deg,#ef4444,#dc2626)', props: 'linear-gradient(135deg,#6366f1,#8b5cf6)' };
          const bg = colors[win.type] || 'linear-gradient(135deg,#4f8ef7,#6366f1)';

          app.innerHTML = `<div class="tb-app-icon" style="background:${bg}">${win.iconSvg || _typeIcon(win.type)}</div><div class="tb-app-dot"></div><button class="tb-app-close" title="Close" aria-label="Close ${win.title || 'window'}"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>`;
          app.onclick = (e) => {
            if (e.target.closest('.tb-app-close')) return; // handled separately
            if (win.minimized) { toggleMinimize(win.id); }
            else if (focused === win.id) { toggleMinimize(win.id); }
            else { focus(win.id); }
          };
          app.querySelector('.tb-app-close').onclick = (e) => {
            e.stopPropagation();

          // Touch: long-press reveals the close button (no hover on touch)
          let lpTimer = null;
          app.addEventListener('touchstart', () => {
            lpTimer = setTimeout(() => {
              document.querySelectorAll('.tb-app.show-actions').forEach(a => { if (a !== app) a.classList.remove('show-actions'); });

          }, { passive: true });
          app.addEventListener('touchend', () => { clearTimeout(lpTimer); }, { passive: true });

      document.addEventListener('touchstart', (e) => {

      }, { passive: true });

      function _updateTbBadge() {
        const badge = document.getElementById('tb-toggle-badge');
        if (!badge) return;
        const n = windows.length;
        badge.textContent = n > 9 ? '9+' : String(n);
        badge.classList.toggle('on', n > 0);
      }

      // ── macOS-style dock magnification (desktop only — mousemove has no touch equivalent) ──
      function _wireDockMagnify() {
        const dock = document.getElementById('taskbar');
        if (!dock || dock._magWired) return;
        dock._magWired = true;
        let raf = null;
        dock.addEventListener('mousemove', e => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = null;
            const apps = dock.querySelectorAll('.tb-app');
            apps.forEach(app => {
              const r = app.getBoundingClientRect();
              const dist = Math.abs(e.clientX - (r.left + r.width / 2));
              const scale = dist < 90 ? 1 + (1 - dist / 90) * 0.35 : 1;
              const lift = dist < 90 ? -(1 - dist / 90) * 8 : 0;
              app.style.transform = `translateY(${lift}px) scale(${scale})`;
            });
          });
        });
        dock.addEventListener('mouseleave', () => {
          dock.querySelectorAll('.tb-app').forEach(app => { app.style.transform = ''; });
        });
      }
